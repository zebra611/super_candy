<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>super_candy · 外呼数字员工</title>
<style>
  :root {
    --bg: #f4f5f7;
    --surface: #ffffff;
    --surface-2: #f9fafb;
    --surface-3: #f1f3f5;
    --line: #e5e7eb;
    --line-2: #d8dce2;
    --ink: #111827;
    --ink-2: #4b5563;
    --ink-3: #9ca3af;
    --brand: #2563eb;
    --brand-2: #1d4ed8;
    --brand-bg: #eff6ff;
    --brand-line: #bfdbfe;
    --ok: #059669;
    --ok-bg: #ecfdf5;
    --warn: #b45309;
    --warn-bg: #fffbeb;
    --bad: #dc2626;
    --bad-bg: #fef2f2;
    --r-sm: 8px;
    --r: 12px;
    --r-lg: 16px;
    --sh-1: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.05);
    --sh-2: 0 6px 16px -4px rgba(16,24,40,.10), 0 2px 6px -2px rgba(16,24,40,.05);
    --ring: 0 0 0 3px rgba(37,99,235,.14);
  }
  * { box-sizing: border-box; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--ink);
    font: 14px/1.6 -apple-system, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", system-ui, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  ::selection { background: var(--brand-line); }

  /* ---------- 顶栏 ---------- */
  .topbar {
    position: sticky; top: 0; z-index: 20;
    display: flex; align-items: center; gap: 12px;
    padding: 11px 22px;
    background: rgba(255,255,255,.86);
    backdrop-filter: saturate(180%) blur(10px);
    border-bottom: 1px solid var(--line);
  }
  .brand { display: flex; align-items: center; gap: 9px; flex: none; }
  .brand-mark {
    width: 26px; height: 26px; border-radius: 8px; flex: none;
    background: linear-gradient(140deg, #3b82f6, #1d4ed8);
    display: grid; place-items: center;
  }
  .brand-mark svg { display: block; }
  .brand-name { font-size: 15px; font-weight: 500; letter-spacing: -.01em; }
  .brand-sub {
    font-size: 11px; color: var(--ink-3); margin-top: -3px;
    letter-spacing: .01em;
  }
  #sceneLine {
    font-size: 12px; color: var(--ink-2);
    border: 1px solid var(--line); background: var(--surface-2);
    border-radius: 999px; padding: 3px 11px;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    max-width: 40vw;
  }
  .topbar .spacer { flex: 1; }
  #sessionLine {
    font-size: 11.5px; color: var(--ink-2);
    font-variant-numeric: tabular-nums;
    white-space: nowrap; max-width: 230px;
    overflow: hidden; text-overflow: ellipsis;
  }

  /* ---------- 版心 ---------- */
  .wrap { max-width: 1080px; margin: 0 auto; padding: 22px 22px 80px; }

  .card {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--sh-1);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

  /* ---------- 启动区 ---------- */
  .launch { padding: 22px 22px 18px; }
  .launch h1 {
    font-size: 19px; font-weight: 500; margin: 0 0 4px;
    letter-spacing: -.01em;
  }
  .launch .sub { font-size: 13px; color: var(--ink-2); margin: 0 0 16px; }
  .mode {
    position: relative; text-align: left; cursor: pointer;
    display: flex; flex-direction: column; gap: 3px;
    padding: 14px 14px 13px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    font: inherit; color: var(--ink);
    transition: border-color .14s, box-shadow .14s, transform .14s;
  }
  .mode:hover:not(:disabled) {
    border-color: var(--line-2); box-shadow: var(--sh-2); transform: translateY(-1px);
  }
  .mode:active:not(:disabled) { transform: translateY(0); }
  .mode:focus-visible { outline: none; box-shadow: var(--ring); }
  .mode:disabled { opacity: .5; cursor: not-allowed; }
  .mode .ico {
    width: 30px; height: 30px; border-radius: 9px;
    display: grid; place-items: center; margin-bottom: 6px;
    background: var(--surface-3); color: var(--ink-2);
  }
  .mode .mt { font-size: 13.5px; font-weight: 500; }
  .mode .md { font-size: 11.5px; color: var(--ink-3); line-height: 1.45; }
  .mode.is-reco { border-color: var(--brand-line); background: var(--brand-bg); }
  .mode.is-reco .ico { background: #dbeafe; color: var(--brand-2); }
  .mode.is-reco:hover:not(:disabled) { border-color: var(--brand); }
  .mode .reco {
    position: absolute; top: 10px; right: 10px;
    font-size: 10.5px; line-height: 15px; padding: 0 7px;
    border-radius: 999px; background: var(--brand); color: #fff;
    letter-spacing: .02em;
  }
  /* 两个动作组：① 选对象（不发起通话）② 开始对话（文字/语音）。
     之前三个按钮并排等权，用户不知道哪个算"正式开始"。 */
  .modes { display: grid; grid-template-columns: 1fr 1.7fr; gap: 12px; }
  .mgroup { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
  .mgroup .mode { flex: 1; }
  .mpair { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; min-width: 0; flex: 1; }
  .mlabel { font-size: 11px; color: var(--ink-3); letter-spacing: .04em; }
  #targetChip {
    /* 放在启动条里、入口按钮右边：桌面端的 .ctrl 在未通话时整行隐藏
       （那一行只有通话中才有意义），目标牌要是放那儿，"看一份档案"之后
       用户恰恰看不到锁了哪家。margin-left:auto 把它推到行尾。 */
    margin-left: auto;
    font-size: 12px; color: var(--ink-2); max-width: 260px;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
    background: var(--surface-3); border: 1px solid var(--line);
    border-radius: 999px; padding: 3px 10px;
    align-self: center;
  }
  #targetChip b { color: var(--ink); font-weight: 600; }

  .ctrl {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin-top: 14px; padding-top: 14px;
    border-top: 1px dashed var(--line);
  }
  #phaseLine {
    font-size: 12.5px; color: var(--ink-2);
    display: inline-flex; align-items: center; gap: 6px;
  }
  #phaseLine::before {
    content: ""; width: 6px; height: 6px; border-radius: 50%;
    background: var(--ink-3); flex: none;
  }
  #phaseLine.live::before { background: var(--ok); box-shadow: 0 0 0 3px var(--ok-bg); }
  #phaseLine.live { color: var(--ok); }

  .launch.compact { padding: 13px 18px; }
  .launch.compact h1,
  .launch.compact .sub,
  .launch.compact .modes { display: none; }
  .launch.compact .ctrl { margin-top: 0; padding-top: 0; border-top: 0; }

  /* ---------- 按钮 ---------- */
  button {
    font: inherit; font-size: 13px;
    padding: 7px 14px; border-radius: var(--r-sm);
    border: 1px solid var(--line-2); background: var(--surface); color: var(--ink);
    cursor: pointer;
    transition: background .13s, border-color .13s, color .13s;
  }
  button:hover:not(:disabled) { background: var(--surface-2); border-color: #c3c8d0; }
  button:focus-visible { outline: none; box-shadow: var(--ring); }
  button:disabled { opacity: .42; cursor: not-allowed; }
  button.primary { background: var(--brand); border-color: var(--brand); color: #fff; }
  button.primary:hover:not(:disabled) { background: var(--brand-2); border-color: var(--brand-2); }
  button.danger { background: var(--surface); border-color: #f0c2c2; color: var(--bad); }
  button.danger:hover:not(:disabled) { background: var(--bad-bg); border-color: #e8a8a8; }
  button.ghost { border-color: transparent; background: transparent; color: var(--ink-2); }
  button.ghost:hover:not(:disabled) { background: var(--surface-3); }

  input[type=text] {
    flex: 1; min-width: 160px; font: inherit; font-size: 13.5px;
    padding: 9px 13px;
    border: 1px solid var(--line-2); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink);
    transition: border-color .13s, box-shadow .13s;
  }
  input[type=text]::placeholder { color: var(--ink-3); }
  input[type=text]:focus { outline: none; border-color: var(--brand); box-shadow: var(--ring); }
  input[type=text]:disabled { background: var(--surface-3); }

  .sel {
    flex: 1; min-width: 200px; font: inherit; font-size: 13px;
    padding: 8px 11px; border: 1px solid var(--line-2); border-radius: var(--r-sm);
    background: var(--surface); color: var(--ink); cursor: pointer;
  }
  .sel:focus { outline: none; border-color: var(--brand); box-shadow: var(--ring); }

  .hint { color: var(--ink-3); font-size: 12px; line-height: 1.55; }

  /* ---------- 对话区 ---------- */
  .convo { padding: 0; overflow: hidden; }
  .convo-head {
    display: flex; align-items: center; gap: 12px; flex-wrap: wrap;
    padding: 11px 18px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
  }
  .convo-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 7px; }
  .convo-title small { font-size: 11.5px; font-weight: 400; color: var(--ink-3); }
  #liveSubtitle {
    font-size: 12px; color: var(--brand-2);
    min-height: 0; flex: 1; text-align: right;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  #liveSubtitle:empty { display: none; }

  /* 七段进度 */
  .stages { display: flex; align-items: center; gap: 0; flex: none; }
  .stages .step {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--surface-3); border: 1px solid var(--line-2);
    flex: none; position: relative;
    transition: background .25s, border-color .25s, transform .25s;
  }
  .stages .bar {
    width: 16px; height: 1px; background: var(--line-2); flex: none;
    transition: background .25s;
  }
  .stages .step.done { background: var(--brand); border-color: var(--brand); }
  .stages .step.now {
    background: var(--brand); border-color: var(--brand);
    transform: scale(1.5);
    box-shadow: 0 0 0 3px var(--brand-bg);
  }
  .stages .bar.done { background: var(--brand); }

  #log {
    min-height: 210px; max-height: min(50vh, 440px);
    overflow-y: auto;
    padding: 18px;
    overscroll-behavior: contain;
  }
  /* 顶部渐隐只在"往上翻过"时出现：停在底部还淡出第一行会像脏点 */
  #log.scrollup {
    -webkit-mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
    mask-image: linear-gradient(to bottom, transparent 0, #000 22px);
  }
  /* 空对话：不说具体尾号。尾号来自档案，首屏还没抽档案时
     写死一个数字会让人照着输一个错号，核身直接失败。 */
  #log:empty::before {
    content: "还没有开始。点「文字对话」，客服会先核对你的手机尾号。";
    display: block; text-align: center;
    color: var(--ink-3); font-size: 13px; line-height: 1.8;
    padding: 62px 24px;
  }

  .msg { display: flex; gap: 9px; margin-bottom: 14px; align-items: flex-start; }
  .msg:last-child { margin-bottom: 0; }
  .who {
    flex: 0 0 28px; width: 28px; height: 28px; border-radius: 50%;
    display: grid; place-items: center;
    font-size: 11px; font-weight: 500;
    background: var(--surface-3); color: var(--ink-2);
    margin-top: 2px; user-select: none;
  }
  .bubble {
    max-width: min(74%, 620px);
    padding: 9px 13px;
    border-radius: 4px 12px 12px 12px;
    background: var(--surface-2);
    border: 1px solid var(--line);
    font-size: 13.5px; line-height: 1.65;
    white-space: pre-wrap; word-break: break-word;
  }
  .msg.agent .who { background: #dbeafe; color: var(--brand-2); }
  .msg.agent .bubble {
    background: var(--brand-bg); border-color: var(--brand-line);
    color: #16305c;
  }
  .msg.user { flex-direction: row-reverse; }
  .msg.user .who { background: var(--brand); color: #fff; }
  .msg.user .bubble {
    background: var(--brand); border-color: var(--brand); color: #fff;
    border-radius: 12px 4px 12px 12px;
  }
  .msg.sys { justify-content: center; }
  .msg.sys .who { display: none; }
  .msg.sys .bubble {
    max-width: 100%;
    background: transparent; border: 1px dashed var(--line-2);
    color: var(--ink-3); font-size: 11.5px; line-height: 1.55;
    border-radius: 999px; padding: 4px 12px;
    text-align: center;
  }
  .tag {
    display: inline-block; font-size: 10.5px; line-height: 16px;
    padding: 0 7px; border-radius: 999px;
    background: rgba(17,24,39,.06); color: var(--ink-2);
    margin-left: 7px; vertical-align: 1px;
    font-variant-numeric: tabular-nums;
    letter-spacing: .02em;
  }
  .msg.user .tag { background: rgba(255,255,255,.22); color: #fff; }

  .composer {
    display: flex; gap: 8px; align-items: center;
    padding: 12px 18px;
    border-top: 1px solid var(--line);
    background: var(--surface);
  }
  .composer input[type=text] { min-width: 0; }
  #audioLine {
    padding: 0 18px 12px;
    font-size: 11.5px; color: var(--ink-3);
    background: var(--surface);
  }
  #audioLine:empty { display: none; }

  /* ---------- 折叠面板 ---------- */
  .panel {
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: var(--r);
    box-shadow: var(--sh-1);
    margin-bottom: 12px;
    overflow: hidden;
  }
  .panel > summary {
    display: flex; align-items: center; gap: 11px;
    padding: 13px 18px;
    cursor: pointer; list-style: none;
    user-select: none;
    transition: background .13s;
  }
  .panel > summary::-webkit-details-marker { display: none; }
  .panel > summary:hover { background: var(--surface-2); }
  .panel > summary:focus-visible { outline: none; box-shadow: inset var(--ring); }
  .panel .p-ico {
    width: 28px; height: 28px; border-radius: 8px; flex: none;
    display: grid; place-items: center;
    background: var(--surface-3); color: var(--ink-2);
  }
  .panel .p-t { font-size: 13.5px; font-weight: 500; flex: none; }
  .panel .p-d {
    font-size: 12px; color: var(--ink-3); flex: 1;
    overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
  }
  .panel .p-state { font-size: 11.5px; color: var(--ink-3); flex: none; }
  .panel .chev {
    width: 16px; height: 16px; flex: none; color: var(--ink-3);
    transition: transform .2s ease;
  }
  .panel[open] .chev { transform: rotate(180deg); }
  .panel[open] > summary { border-bottom: 1px solid var(--line); }
  .p-body { padding: 16px 18px; animation: fade .18s ease; }
  @keyframes fade { from { opacity: 0; transform: translateY(-3px); } to { opacity: 1; transform: none; } }

  /* ---------- 指标 ---------- */
  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .meter {
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 11px 13px;
  }
  .meter .k { font-size: 11.5px; color: var(--ink-3); line-height: 1.4; }
  .meter .v {
    font-size: 20px; font-weight: 500; letter-spacing: -.02em;
    margin-top: 3px; font-variant-numeric: tabular-nums;
  }
  #metricNote { color: var(--ink-3); font-size: 11.5px; margin-top: 10px; line-height: 1.55; }

  /* ---------- 事件链 ---------- */
  #events {
    font-family: ui-monospace, "Cascadia Mono", Consolas, monospace;
    font-size: 11.5px; line-height: 1.7;
    color: var(--ink-2);
    white-space: pre-wrap;
    max-height: 260px; overflow-y: auto;
    background: var(--surface-2);
    border: 1px solid var(--line);
    border-radius: var(--r-sm);
    padding: 12px 14px;
  }

  /* ---------- 档案 ---------- */
  #randomCard { border: 0; box-shadow: none; padding: 0; margin: 0; background: transparent; }
  /* ---------- 档案浏览（按类目挑） ---------- */
  #browseBox {
    margin-bottom: 10px; border: 1px solid var(--line);
    border-radius: 10px; background: var(--surface-2);
    padding: 8px 10px;
  }
  .browse-head { display: flex; align-items: center; justify-content: space-between; }
  .browse-title { font-size: 12.5px; font-weight: 600; color: var(--ink-1); }
  .browse-title b { color: var(--brand); font-weight: 600; }
  .browse-close {
    border: 0; background: transparent; color: var(--ink-3);
    font-size: 12px; cursor: pointer; padding: 2px 6px; border-radius: 6px;
  }
  .browse-close:hover { color: var(--ink-1); background: var(--surface-3); }
  .browse-chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0 6px; }
  .browse-chips button {
    font-size: 11.5px; padding: 2px 9px; border-radius: 999px;
    border: 1px solid var(--line); background: var(--surface-1);
    color: var(--ink-2); cursor: pointer;
  }
  .browse-chips button.is-on {
    background: var(--brand); border-color: var(--brand); color: #fff;
  }
  .browse-list {
    max-height: 300px; overflow-y: auto; overscroll-behavior: contain;
    display: flex; flex-direction: column; gap: 4px;
  }
  .browse-row {
    text-align: left; border: 1px solid var(--line); border-radius: 8px;
    background: var(--surface-1); padding: 6px 9px; cursor: pointer;
    font-size: 12px; color: var(--ink-1);
  }
  .browse-row:hover { border-color: var(--brand); }
  .browse-row.is-on { border-color: var(--brand); background: var(--surface-3); }
  .browse-row .bc {
    font-weight: 600; font-size: 12.5px; word-break: break-word;
  }
  .browse-row .bm { margin-top: 2px; color: var(--ink-3); font-size: 11.5px; }
  .browse-empty { font-size: 12px; color: var(--ink-3); padding: 8px 2px; }
  /* 原来这里还有一条 #targetPanel.is-empty .p-body::before 的空态文案。
     重构后 .p-body 已经不存在，规则整条失效，且与新空态（见下方 ::after）重复，删掉。 */
  /* 档案：先给三行"待会儿真要用到的"，其余全字段收进折叠区。
     一张档案 40+ 个字段，全铺开等于让人现场读表格，所以按"用途"分层。 */
  .randinfo { display: block; }
  .rname {
    font-size: 14.5px; font-weight: 600; letter-spacing: -.01em;
    line-height: 1.35; word-break: break-word;
  }
  .rmeta {
    margin-top: 4px; font-size: 12px; color: var(--ink-2);
    display: flex; flex-wrap: wrap; gap: 2px 6px; align-items: baseline;
  }
  .rmeta .dot { color: var(--line-2); }
  .rrow { display: flex; gap: 8px; margin-top: 8px; font-size: 12.5px; line-height: 1.55; }
  .rrow .rk { flex: 0 0 36px; color: var(--ink-3); font-size: 11.5px; padding-top: 1px; }
  .rrow .rv { flex: 1; min-width: 0; color: var(--ink); word-break: break-word; }
  .rrow .rv .sub { display: block; color: var(--ink-3); font-size: 11.5px; margin-top: 1px; }

  /* 补料清单：打电话最常被追问的就是"到底要补哪几样"。
     原来这里只显示前两项 +「等 N 项」，剩下的得自己翻档案——等于把问题留在现场。
     现在逐条列全，并把它 sticky 在面板顶部：翻下面的字段时清单一动不动。
     每一行都来自档案字段，缺字段就整块不渲染，不做任何兜底文案。 */
  .mat-guide {
    position: sticky; top: 0; z-index: 2;
    margin: 10px 0 2px; padding: 10px 11px 9px;
    background: var(--surface-2);
    border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .mg-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; }
  .mg-t { font-size: 12px; font-weight: 600; color: var(--ink); letter-spacing: -.01em; }
  .mg-n { font-size: 11px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .mg-list { margin: 6px 0 0; padding: 0; list-style: none; }
  .mg-list li {
    display: flex; gap: 6px; font-size: 12.5px; line-height: 1.5;
    color: var(--ink); padding: 1px 0;
  }
  .mg-list .no { flex: 0 0 14px; color: var(--ink-3); font-variant-numeric: tabular-nums; }
  .mg-list .mt { flex: 1; min-width: 0; word-break: break-word; }
  .mg-foot {
    margin-top: 7px; padding-top: 6px; border-top: 1px dashed var(--line-2);
    display: flex; flex-wrap: wrap; gap: 2px 10px; font-size: 11px; color: var(--ink-3);
  }
  .mg-foot b { font-weight: 500; color: var(--ink-2); font-variant-numeric: tabular-nums; }

  .rq {
    margin: 10px 0 0; padding: 8px 10px;
    background: var(--surface-2); border: 1px solid var(--line); border-radius: var(--r-sm);
  }
  .rq .qk { display: block; font-size: 10.5px; letter-spacing: .04em; color: var(--ink-3); margin-bottom: 3px; }
  .rq blockquote {
    margin: 0; font-size: 12px; line-height: 1.6; color: var(--ink-2);
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden;
  }
  .rmore { margin-top: 9px; border-top: 1px solid var(--line); padding-top: 8px; }
  .rmore > summary {
    font-size: 11.5px; color: var(--ink-3); cursor: pointer; list-style: none;
    display: flex; align-items: center; gap: 5px; user-select: none;
  }
  .rmore > summary::-webkit-details-marker { display: none; }
  .rmore > summary::before { content: "＋"; }
  .rmore[open] > summary::before { content: "－"; }
  .rmore > summary:hover { color: var(--ink-2); }
  /* 侧栏只有 330px 上下，两列会把身份证号、信用代码折断，这里固定单列 */
  .rgrid { display: block; margin-top: 5px; }
  .rgrid .ri {
    display: flex; gap: 6px; font-size: 11.5px; line-height: 1.5;
    padding: 4px 0; border-bottom: 1px solid var(--line); align-items: baseline;
  }
  .rgrid .ri.long { grid-column: 1 / -1; }
  .rgrid .k { flex: 0 0 96px; color: var(--ink-3); font-size: 11px; }
  .rgrid .v { word-break: normal; overflow-wrap: anywhere; }
  .rgrid .v { flex: 1; min-width: 0; color: var(--ink-2); word-break: break-word; }
  .rgrid .v.hl { color: var(--brand-2); font-weight: 500; }

  /* ---------- 训练回放 ---------- */
  #trainFlow { margin-top: 14px; max-height: 480px; overflow-y: auto; }
  .tl {
    border-top: 1px solid var(--line);
    padding: 12px 0 2px;
  }
  .tl:first-child { border-top: 0; padding-top: 0; }
  .tmeta {
    font-size: 11.5px; color: var(--ink-3);
    margin-bottom: 8px;
    display: flex; align-items: center; gap: 6px; flex-wrap: wrap;
  }
  .lvl {
    display: inline-block; font-size: 10.5px; line-height: 16px;
    padding: 0 7px; border-radius: 999px;
    background: var(--warn-bg); color: var(--warn);
    font-variant-numeric: tabular-nums;
  }
  .weak {
    display: inline-block; font-size: 10.5px; line-height: 16px;
    padding: 0 7px; border-radius: 999px;
    background: var(--bad-bg); color: var(--bad);
  }
  .verdict {
    font-size: 13.5px; font-weight: 500; margin-top: 16px;
    padding: 10px 13px; border-radius: var(--r-sm);
    background: var(--surface-2); border: 1px solid var(--line);
  }
  .verdict.ok { color: var(--ok); background: var(--ok-bg); border-color: #b7e4d0; }
  .verdict.bad { color: var(--bad); background: var(--bad-bg); border-color: #f5c6c6; }
  .weakgrid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; margin-top: 10px; }
  .weakcell {
    background: var(--surface-2); border: 1px solid var(--line);
    border-radius: var(--r-sm); padding: 9px 11px;
  }
  .weakcell .k { font-size: 11px; color: var(--ink-3); line-height: 1.4; }
  .weakcell .v {
    font-size: 17px; font-weight: 500; margin-top: 2px;
    font-variant-numeric: tabular-nums;
  }

  /* ---------- 自进化 ---------- */
  #evolveBody { margin-top: 14px; }
  .evtable { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  .evtable th, .evtable td {
    text-align: left; padding: 8px 10px;
    border-bottom: 1px solid var(--line);
    vertical-align: top;
  }
  .evtable th { color: var(--ink-3); font-weight: 400; font-size: 11.5px; }
  .evtable tr:last-child td { border-bottom: 0; }
  .evtable tr.latest td { background: #f7faf8; }
  .evtag {
    display: inline-block; font-size: 10.5px; line-height: 16px;
    padding: 0 7px; border-radius: 999px; margin-left: 4px;
  }
  .evtag.ok { background: var(--ok-bg); color: var(--ok); }
  .evtag.no { background: var(--bad-bg); color: var(--bad); }
  .evround { border-top: 1px solid var(--line); padding: 10px 0; }
  .evround:first-child { border-top: 0; padding-top: 0; }
  .evcheck { font-size: 12px; color: var(--ink-3); padding-left: 12px; line-height: 1.7; }
  .evcheck b { font-weight: 500; color: var(--ink); }
  .evwhy { font-size: 12.5px; color: var(--ink); line-height: 1.6; }
  .evquote {
    font-size: 11.5px; color: var(--ink-3); padding-left: 12px;
    line-height: 1.6; word-break: break-word;
  }

  /* ---------- 引导条 ---------- */
  .guide {
    display: flex; gap: 10px; align-items: flex-start;
    padding: 10px 13px; margin-bottom: 12px;
    background: var(--brand-bg);
    border: 1px solid var(--brand-line);
    border-radius: var(--r-sm);
    font-size: 12.5px; color: #16305c; line-height: 1.6;
  }
  .guide svg { flex: none; margin-top: 2px; color: var(--brand); }
  .guide b { font-weight: 500; }
  .guide.hide { display: none; }

  /* ---------- 响应式 ---------- */
  @media (max-width: 820px) {
    .modes { grid-template-columns: 1fr; gap: 8px; }
    .mode { flex-direction: row; align-items: center; padding: 12px 14px; gap: 10px; }
    .mode .ico { margin-bottom: 0; }
    .mode .mt { flex: none; }
    .mode .md { flex: 1; text-align: right; font-size: 11px; }
    .mode .reco { display: none; }
    .launch h1 { font-size: 17px; }
    .launch { padding: 18px 16px 14px; }
    #log:empty::before { padding: 56px 20px; }
    .meters { grid-template-columns: repeat(2, 1fr); }
    .weakgrid { grid-template-columns: repeat(2, 1fr); }
    .randinfo { grid-template-columns: 1fr; }
    .randinfo .k { flex-basis: 92px; }
    #sceneLine { display: none; }
    .panel .p-d { display: none; }
    .wrap { padding: 16px 14px 64px; }
    .convo-head { padding: 10px 14px; }
    #log { padding: 14px; max-height: 48vh; }
    .bubble { max-width: 84%; }
    .p-body { padding: 14px; }
  }
  @media (max-width: 520px) {
    .brand-sub { display: none; }
    #sessionLine { display: none; }
    .stages .bar { width: 9px; }
  }
  /* 训练回放：客户侧到底谁在说话（模型 / 规则 / 回退），逐轮标在气泡右下 */
  #spBody { margin-top: 10px; }
  .bubble .m { display: inline-block; margin-left: 6px; vertical-align: middle; }
  .spbadge {
    display: inline-block; font-size: 10.5px; line-height: 15px; padding: 0 5px;
    border-radius: 4px; background: var(--surface-3); color: var(--ink-3);
    margin-right: 4px; font-weight: 400;
  }
  .spbadge.llm { background: var(--ok-bg); color: var(--ok); }
  .spbadge.rule { background: var(--warn-bg); color: var(--warn); }

  @media (prefers-reduced-motion: reduce) {
    * { transition: none !important; animation: none !important; }
  }

  /* ================= 全屏两栏：对话主位 + 右侧标签页 =================
     桌面端整页不滚动（body 固定视口高度），左右两栏各自独立：
       · 左栏：启动条 + 动态提示 + 通话记录（内部上滑，框体尺寸恒定）
       · 右栏：五个标签页，点一个换一个，内容区自己滚动
     两栏高度都由视口算出来，切标签、加消息都不会互相推动。
     窄屏（<1081px）退回单列瀑布流，页面正常滚动。 */

  /* ---- 启动条：三个入口压成一行胶囊 ---- */
  .launch {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    padding: 8px 10px;
  }
  .launch h1 { display: none; }
  .launch .modes { display: flex; gap: 6px; flex: 1 1 auto; min-width: 0; }
  .launch .mode {
    flex: 0 1 auto; flex-direction: row; align-items: center; gap: 6px;
    padding: 4px 12px 4px 6px; border-radius: 999px;
  }
  .launch .mode .ico { width: 22px; height: 22px; border-radius: 999px; margin: 0; }
  .launch .mode .md { display: none; }
  .launch .mode .mt { font-size: 12.5px; white-space: nowrap; }
  .launch .mode .reco {
    position: static; margin: 0; padding: 0 5px;
    font-size: 9.5px; line-height: 14px;
  }
  .launch .ctrl { margin: 0; padding: 0; border: 0; gap: 6px; flex-wrap: nowrap; }
  /* 没在通话时，暂停/挂断/状态一律不占版面：那一行只在通话中才有意义 */
  .launch:not(.compact) .ctrl { display: none; }
  .launch .ctrl button { padding: 4px 11px; font-size: 12.5px; }
  #phaseLine { font-size: 12px; }
  .launch.compact { padding: 8px 10px; }

  /* ---- 动态提示条：随阶段换内容，填的是这一单的真实信息 ---- */
  .guide {
    display: flex; align-items: center; gap: 9px;
    padding: 8px 12px; margin: 0;
    background: var(--brand-bg);
    border: 1px solid var(--brand-line);
    border-radius: var(--r-sm);
    font-size: 12.5px; color: #16305c; line-height: 1.55;
  }
  .guide .g-k {
    flex: none; padding: 1px 8px; border-radius: 999px;
    background: var(--brand); color: #fff;
    font-size: 10.5px; line-height: 16px; letter-spacing: .02em;
  }
  .guide .g-t { flex: 1; min-width: 0; }
  .guide .g-t b { font-weight: 600; color: var(--brand-2); }
  .guide.hide { display: none; }

  /* ---- 对话区：框体高度由父容器决定，只有内容区滚动 ---- */
  .convo {
    position: relative;
    display: flex; flex-direction: column;
    padding: 0; overflow: hidden;
  }
  .convo #log { flex: 1 1 auto; min-height: 0; max-height: none; padding: 16px 18px; }
  .convo-head { flex: none; }
  .composer, #audioLine { flex: none; }

  /* 「有新消息 ↓」：用户往上翻的时候才出现，点一下回到底部 */
  .jump {
    position: absolute; left: 50%; transform: translateX(-50%);
    bottom: 92px; z-index: 3;
    padding: 3px 12px; font-size: 11.5px; line-height: 20px;
    border-radius: 999px;
    background: var(--brand); border-color: var(--brand); color: #fff;
    box-shadow: 0 4px 12px -2px rgba(37,99,235,.38);
  }
  .jump[hidden] { display: none; }
  .jump:hover:not(:disabled) { background: var(--brand-2); border-color: var(--brand-2); }

  /* ---- 右栏：一行五个标签 + 一块内容 ---- */
  .tools { padding: 0; overflow: hidden; display: flex; flex-direction: column; }
  .tabbar {
    display: flex; flex: none; padding: 0 4px;
    border-bottom: 1px solid var(--line);
    background: var(--surface-2);
    overflow-x: auto; scrollbar-width: none;
  }
  .tabbar::-webkit-scrollbar { display: none; }
  .tgroup {
    flex: none; align-self: center;
    font-size: 10.5px; color: var(--ink-3); letter-spacing: .06em;
    padding: 0 8px; white-space: nowrap;
  }
  .tab {
    flex: 1 1 0; min-width: 54px; position: relative;
    padding: 11px 2px 10px;
    border: 0; border-radius: 0; background: none;
    font: inherit; font-size: 12.5px; color: var(--ink-2);
    white-space: nowrap; cursor: pointer;
    transition: color .13s;
  }
  .tab:hover:not(.is-on):not(:disabled) { background: none; color: var(--ink); }
  .tab.is-on { color: var(--brand); font-weight: 500; }
  .tab.is-on::after {
    content: ""; position: absolute; left: 50%; bottom: 0;
    transform: translateX(-50%);
    width: 20px; height: 2px; border-radius: 2px 2px 0 0;
    background: var(--brand);
  }
  .tab:focus-visible { outline: none; box-shadow: inset var(--ring); }

  .pane { display: none; padding: 14px 16px 16px; }
  .pane.is-on { display: block; }
  .pane-top {
    display: flex; align-items: center; justify-content: space-between; gap: 8px;
    margin-bottom: 9px;
    font-size: 11px; color: var(--ink-3); letter-spacing: .02em;
  }
  .p-state {
    font-size: 11px; color: var(--ink-3);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    min-width: 0;
  }
  .pane .sel { min-width: 0; flex: 1 1 0; font-size: 12px; padding: 6px 9px; }
  .pane .row button { padding: 6px 12px; font-size: 12.5px; }
  .pane .hint { font-size: 11.5px; line-height: 1.5; }
  .pane .meters { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
  .pane .meter { padding: 9px 10px; }
  .pane .meter .k { font-size: 11px; }
  .pane .meter .v { font-size: 17px; }

  /* 空态放在标题行之后（::after），否则"本次外呼目标"会被顶到提示语下面。
     文案里不写方位：宽屏时三个入口在左栏、窄屏时在上方，写"上方/左侧"必有一边是错的。 */
  #targetPanel.is-empty::after {
    content: "点「看一份档案」挑一份，或直接开始通话，系统会自动带出一份。";
    display: block; color: var(--ink-3); font-size: 12px; line-height: 1.7;
  }

  /* 空对话：整块居中，不要贴在某条固定内边距上 */
  #log:empty { display: grid; place-items: center; }
  #log:empty::before { padding: 0; max-width: 360px; }

  /* ---- 桌面：撑满视口，两栏各自滚动 ---- */
  @media (min-width: 1024px) {
    html, body { height: 100%; }
    body { display: flex; flex-direction: column; overflow: hidden; }
    .topbar { position: static; flex: none; }

    .wrap {
      flex: 1 1 auto; min-height: 0; width: 100%;
      max-width: 1560px; margin: 0 auto;
      padding: 14px 18px 16px;
      display: grid;
      grid-template-columns: minmax(0, 1fr) minmax(380px, .46fr);
      gap: 14px; align-items: stretch;
    }
    .col-main, .col-side { display: flex; flex-direction: column; gap: 10px; min-height: 0; }
    .col-main > .card, .col-side > .card { margin-bottom: 0; }

    .convo { flex: 1 1 auto; min-height: 0; }
    .tools { flex: 1 1 auto; min-height: 0; }
    .panes { position: relative; flex: 1 1 auto; min-height: 0; }
    .panes > .pane { position: absolute; inset: 0; overflow-y: auto; overscroll-behavior: contain; }
    .panes > .pane:not(.is-on) { display: none; }
    /* 面板自己会滚，训练逐轮列表不再套一层滚动条 */
    .pane #trainFlow { max-height: none; }
  }

  /* ---- 窄屏：单列瀑布流，对话区仍是固定框体 ---- */
  @media (max-width: 1023px) {
    .wrap { display: flex; flex-direction: column; gap: 10px; padding: 14px 14px 48px; }
    .col-main, .col-side { display: flex; flex-direction: column; gap: 10px; min-width: 0; }
    .col-main > .card, .col-side > .card { margin-bottom: 0; }
    .convo { height: min(74vh, 640px); min-height: 400px; }
    .pane { padding: 13px 14px 15px; }
    .launch { padding: 8px 9px; }
    .launch .modes { flex-wrap: wrap; }
  }

  @media (max-width: 520px) {
    .launch .ctrl { width: 100%; justify-content: flex-start; }
    .tab { font-size: 12px; padding: 10px 1px 9px; }
  }
</style>
</head>
<body>

<header class="topbar">
  <div class="brand">
    <span class="brand-mark">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
        <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
        <line x1="12" y1="19" x2="12" y2="22"/>
      </svg>
    </span>
    <span>
      <div class="brand-name">super_candy</div>
      <div class="brand-sub">外呼数字员工</div>
    </span>
  </div>
  <span id="sceneLine">正在连接服务…</span>
  <span class="spacer"></span>
  <span id="sessionLine">未开始</span>
</header>

<main class="wrap">
  <div class="col-main">

    <section class="card launch">
      <div class="modes">
        <div class="mgroup">
          <span class="mlabel">① 先选对象</span>
          <div class="mpair">
            <button id="btnRandom" class="mode" title="只抽一份商户档案看，不发起通话。看完再点「文字对话」即可让客服基于它开场">
              <span class="ico">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <rect x="3" y="4" width="18" height="16" rx="2"/>
                  <path d="M3 9h18M9 9v11"/>
                </svg>
              </span>
              <span class="mt">随机一份</span>
              <span class="md">不发起通话</span>
            </button>
            <button id="btnBrowse" class="mode" title="按类目浏览全部示例档案，挑一家再开始对话">
              <span class="ico">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M4 6h16M4 12h16M4 18h16"/>
                  <circle cx="9" cy="6" r="1.4" fill="currentColor" stroke="none"/>
                  <circle cx="15" cy="12" r="1.4" fill="currentColor" stroke="none"/>
                  <circle cx="7" cy="18" r="1.4" fill="currentColor" stroke="none"/>
                </svg>
              </span>
              <span class="mt">全部档案</span>
              <span class="md">按类目挑选</span>
            </button>
          </div>
        </div>
        <div class="mgroup mgroup-wide">
          <span class="mlabel">② 再开始对话</span>
          <div class="mpair">
            <button id="btnText" class="mode is-reco" title="不开启语音系统：不连麦克风、不合成播放语音，直接在下方打字与客服对话">
              <span class="ico">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
                </svg>
              </span>
              <span class="mt">文字对话</span>
              <span class="reco">推荐</span>
            </button>
            <button id="btnStart" class="mode" title="完整语音链路：打开麦克风，客服会说话，你也可以直接插话打断">
              <span class="ico">
                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
                  <path d="M12 2a3 3 0 0 0-3 3v7a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/>
                  <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
                </svg>
              </span>
              <span class="mt">语音通话</span>
            </button>
          </div>
        </div>
      </div>

      <span id="targetChip" hidden>本次目标：<b id="targetChipName"></b></span>

      <div class="ctrl">
        <button id="btnRec" hidden>暂停聆听</button>
        <button id="btnEnd" class="danger" disabled>挂断</button>
        <button id="btnEnableAudio" class="primary" hidden>点此开启语音播报</button>
        <span id="phaseLine">未开始</span>
      </div>
    </section>

    <div class="guide" id="firstGuide">
      <span class="g-k" id="guideStep">第 1 步</span>
      <span class="g-t" id="guideText">先点「看一份档案」挑一份，或直接开始通话；客服会先核对手机尾号。</span>
    </div>

    <section class="card convo">
      <div class="convo-head">
        <span class="convo-title">
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" style="color:var(--ink-3)">
            <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
          </svg>
          通话记录 <small id="stageNow">待开始</small>
        </span>
        <span class="stages" id="stageBar">
          <span class="step" title="开场自报"></span><span class="bar"></span>
          <span class="step" title="身份确认"></span><span class="bar"></span>
          <span class="step" title="需求确认"></span><span class="bar"></span>
          <span class="step" title="方案沟通"></span><span class="bar"></span>
          <span class="step" title="结果确认"></span><span class="bar"></span>
          <span class="step" title="结果回写"></span><span class="bar"></span>
          <span class="step" title="完成"></span>
        </span>
        <span id="liveSubtitle"></span>
      </div>

      <div id="log"></div>

      <button id="btnJump" class="jump" hidden>有新消息 ↓</button>

      <div class="composer">
        <input type="text" id="textInput" placeholder="输入一句话，例如「是什么原因没通过」；开始通话后才能发送" disabled>
        <button id="btnSilence" class="ghost" title="发一个空轮次：模拟用户没说话（用于验证沉默处理，不推进状态机）" hidden>模拟不说话</button>
        <button id="btnSend" class="primary" disabled>发送</button>
      </div>
      <div id="audioLine">麦克风未启用。点「语音通话」后会自动打开，直接说话即可，客服说话时可以插话打断。</div>
    </section>

  </div>

  <aside class="col-side">

    <section class="card tools">

<script>
// 全部状态放这里，避免到处找变量。
// token 是这通电话的读取凭证：没有它，别人拿到 session_id 也查不到事件与报告。
const S = { sessionId: null, token: null, pendingTarget: null, textOnly: false,
            busy: false, turnId: 0, t0: 0,
            // 界面状态机（idle/text/voice/paused/closed），见 render()
            ui: "idle",
            // 事件链快照：服务端 end_call 会把会话从内存里删掉，挂断后再查
            // 就是 UNKNOWN_SESSION。挂断瞬间（会话还活着时）先拉好一份存着，
            // 之后「事件链」标签的「刷新」用这份快照——比"点了没反应"诚实。
            lastEvents: "",
            // 连续通话状态机：idle → listening → user → thinking → agent → (打断) → user
            phase: "idle", autoMode: false,
            silentFrames: 0, bargeHits: 0, onsetHits: 0, prevPhase: "idle",
            // 打断的两段式状态：idle（等声音）→ suspect（疑似，已压低音量）
            // → probing（正在识别这段到底说了什么）。只有 identify 出实义文字才真停。
            bargeState: "idle", bargeBuf: [], ducked: false,
            // 当前正在播报的文本。用途：探针识别出的文字要是与它高度重合，
            // 那就是**自己的回声**，不是用户在插话。没有这个字段时，
            // 外放环境下麦克风收到自己的播报，ASR 会原样识别出客服的话，
            // _has_interrupt_content 判"有实义"→ 直接停播。这是硬 bug。
            agentText: "",
            currentAudio: null, playToken: 0,
            // 纯文字模式走 HTTP，没有服务端收线，只能靠前端定时器；
            // 定时器必须可取消，否则上一通的会把新开的通话挂掉。
            hangupTimer: null,
            // 移动端 Safari 自动播放限制：首次用户手势解锁音频后再播。
            audioUnlocked: false, audioCtx: null, audioUnlockEl: null,
            audioUnlockPrompted: false, pendingSpeak: null, pendingWs: null,
            // 终态硬截止：第一次收到收尾信号就锁定，后续 ACK 轮不得续期。
            terminalAt: null };

// VAD 判定参数。逐帧（20ms）算特征，不起模型：这段链路在浏览器主线程上跑，
// 一秒 50 次，必须便宜。
//
// Z6 把"纯能量"升级成"能量 + 谱特征"，原因很实在：
//   能量门挡不住键盘（瞬态够响）和摩擦声，演示现场敲一下键盘就会切一轮。
//   语音与噪声在谱上的差别比在响度上大得多：
//     · 过零率：语音 0.1~0.3，白噪/纸张摩擦 >0.4
//     · 谱倾斜（400Hz 能量 / 2000Hz 能量）：语音低频强（>1），键盘高频强（<0.3）
//   zcrMax / tiltMin 是**宽松值**：宁可多放进来（后面还有 3 帧确认 + 服务端
//   VAD + ASR 三层），也不要漏掉真人说话。浏览器开了噪声抑制与 AGC，
//   与离线语料的电平分布不同，所以这两个值现场还要用 ?vaddebug=1 看一眼再定。
const VAD = {
  speechRms: 0.020,      // 一帧超过它 = 有人在说话（约 -34dBFS）
  silenceRms: 0.010,     // 低于它算静音
  endpointFrames: 35,    // 连续 35 帧静音 = 700ms，判"说完了"
  bargeRms: 0.040,       // 疑似插话阈值：0.035→0.040，配合谱特征门挡噪声；0.050 会漏弱 AEC 插话
  bargeFrames: 5,        // 连续 5 帧（100ms）才算疑似，原来 3 帧（60ms）太短
  // 以下是"疑似之后"的两段式参数。光有能量不算插话，要等这段说完、
  // 识别出实义文字才停播——否则清个嗓子就能把客服打断，而且不可逆。
  probeSilenceFrames: 18,  // 疑似之后静音 18 帧（360ms）= 这一句说完了
  bargeMaxFrames: 160,     // 最多攒 160 帧（3.2 秒），防止用户一直说导致永远不判
  duckVolume: 0.45,        // 疑似期只轻压到 45%；真插话由 stopPlayback 直接停
  // Z6 新增：谱特征门与开口确认
  zcrMax: 0.45,          // 过零率上限，挡白噪/纸张摩擦（0.45 偏宽，只为不误伤真人）
  tiltMin: 0.35,         // 低频/高频能量比下限，挡键盘（实测键盘约 0.1）
  onsetFrames: 2,        // 连续 2 帧（40ms）够"像人声"才算开口，键盘单帧不再触发
};

// 现场标定开关：地址后面加 ?vaddebug=1，麦克风状态行会实时显示 rms/zcr/tilt
// 与判定结果。为什么要有：浏览器噪声抑制 + 设备频响会让"理论阈值"偏一截，
// 现场 30 秒看一眼就知道该往哪调，比事后猜快得多。
const VAD_DEBUG = /[?&]vaddebug=1/.test(location.search);

const $ = (id) => document.getElementById(id);

// ---------------------------------------------------------------------------
// 界面增强层：只做"看得懂"，不碰任何业务判断。
// 原则：不改后端契约、不改状态机、不改既有函数签名，只在渲染时补语义。
// ---------------------------------------------------------------------------

// 七步流程的展示名，与 contracts.STAGES 一一对应（顺序也不能改）。
const STAGE_SEQ = ["GREETING", "IDENTITY", "NEED", "OFFER", "CONFIRM", "WRITEBACK", "DONE"];
const STAGE_CN = {
  GREETING: "开场自报", IDENTITY: "身份确认", NEED: "需求确认",
  OFFER: "方案沟通", CONFIRM: "结果确认", WRITEBACK: "结果回写", DONE: "完成",
};

// 客服每条回复都带 tag（=next_stage），用它点亮进度条。
// 后端改了阶段名这里会自然失效（不亮），但绝不会报错，不影响对话。
function markStage(tag) {
  let i = STAGE_SEQ.indexOf(tag);
  if (i < 0 && tag === "开场") i = 0;
  if (i < 0) return;
  const bar = $("stageBar");
  if (!bar) return;
  bar.querySelectorAll(".step").forEach((el, k) => {
    el.classList.toggle("done", k < i);
    el.classList.toggle("now", k === i);
    el.title = STAGE_CN[STAGE_SEQ[k]] + (k === i ? " · 当前" : "");
  });
  bar.querySelectorAll(".bar").forEach((el, k) => el.classList.toggle("done", k < i));
  const now = $("stageNow");
  if (now) now.textContent = STAGE_CN[STAGE_SEQ[i]] || "进行中";
  TIP.idx = i;
  renderTip();
}

// 提示条不是一段固定教材：跟着阶段换内容，并把这一单真实的尾号、驳回原因填进去，
// 用户照着念一句就能推进。数据来源两个——档案接口（renderRandomCompany）与每轮的 next_stage（markStage）。
const TIP = { idx: -1, tail: "", reject: "", closed: false };
let LOGSTICK = true;   // 对话框是否贴底：贴底才自动跟随新消息

// 输入框的提示语也带"这一单"的信息：有档案就给出真实尾号当例子，
// 没档案就用诉求当例子——写死一个数字，用户会照着输一个核身对不上的号。
const INPUT_HINT = "输入一句话，例如「是什么原因没通过」；要测沉默请点「模拟不说话」";
function setInputHint(tail) {
  const el = $("textInput");
  if (!el) return;
  el.placeholder = tail
    ? "输入一句话，例如「尾号" + tail + "」；要测沉默请点「模拟不说话」"
    : INPUT_HINT;
}

// 驳回原因常是一长句，塞进提示条只要前半截就够认。
function tipAsk() {
  const r = (TIP.reject || "").trim();
  if (!r) return "资质驳回到底怎么回事";
  return (r.length > 15 ? r.slice(0, 15) : r) + " 到底怎么回事";
}

function renderTip() {
  const k = $("guideStep"), t = $("guideText");
  if (!k || !t) return;
  const i = TIP.closed ? 9 : TIP.idx;
  const tail = escapeHtml(TIP.tail || "");
  // 不再用"第 N 步"编号：右侧进度条是后端 7 个阶段，两套编号对不上，
  // 用户看到"第 2 步"却找不到进度条上的"第 2 格"。这里只说"下一步做什么"，
  // 编号叙事交给进度条一条线。
  let step = "下一步", html = "";
  if (TIP.closed) {
    // 已经挂断：不再教人点「挂断」——那个按钮这时已经收了，
    // 提示指向一个不存在的按钮，比不提示更让人茫然。
    step = "已结束";
    html = "这通电话已经结束，结果已回写到工单。「事件链」标签里有完整记录。";
  } else if (i >= 5) {
    step = "已完成";
    html = "这通电话已经走完，结果会回写到工单。「事件链」标签里有回写记录，点「挂断」收尾。";
  } else if (i === 4) {
    step = "收尾";
    html = "客服在做最后确认：不用人接手就回 <b>「不用了」</b>，要人接手就回 <b>「要转人工」</b>。";
  } else if (i === 3) {
    html = "方案已经给出。同意就回 <b>「办吧」</b> 或 <b>「同意」</b>——含糊的回答不会被当作同意。";
  } else if (i === 2) {
    html = "接着说诉求，例如 <b>「" + escapeHtml(tipAsk()) + "」</b>，客服会讲清原因和要补的材料。";
  } else if (!tail) {
    // 还没抽档案：这里绝不能写死一个尾号。尾号是每份档案各自的，
    // 编一个数出来，用户照着输就核身失败——比不提示更糟。
    html = "先点「看一份档案」挑一份，或直接开始通话；客服会先核对手机尾号。";
  } else {
    html = "先报身份：输入 <b>尾号" + tail + "</b> 并发送，客服核对手机尾号。";
  }
  k.textContent = step;
  t.innerHTML = html;   // 只由上面的常量与 escapeHtml 结果拼成，无外部原文
}

// 五个标签页：右栏只放一块内容，框体高度恒定，切页不跳动。
function openPane(id) {
  const t = document.querySelector('.tab[data-pane="' + id + '"]');
  if (t) t.click();
}

function initTabs() {
  const bar = $("toolTabs");
  if (!bar) return;
  const tabs = [].slice.call(bar.querySelectorAll(".tab"));
  const pick = (t) => tabs.forEach(x => {
    const on = x === t;
    x.classList.toggle("is-on", on);
    x.setAttribute("aria-selected", on ? "true" : "false");
    const pane = $(x.dataset.pane);
    if (pane) pane.classList.toggle("is-on", on);
  });
  tabs.forEach(t => t.addEventListener("click", () => pick(t)));
}

// 微信式滚动：停在底部就跟随新消息；用户往上翻就不抢位置，只留一个「有新消息」。
function initLogScroll() {
  const el = $("log"), btn = $("btnJump");
  if (!el) return;
  el.addEventListener("scroll", () => {
    const gap = el.scrollHeight - el.scrollTop - el.clientHeight;
    LOGSTICK = gap < 40;
    el.classList.toggle("scrollup", el.scrollTop > 4);
    if (LOGSTICK && btn) btn.hidden = true;
  }, { passive: true });
  if (btn) btn.addEventListener("click", () => {
    el.scrollTop = el.scrollHeight;
    LOGSTICK = true;
    btn.hidden = true;
  });
}

// ---------------------------------------------------------------------------
// 界面状态机：全页只有 5 个状态，按钮/输入框/状态行全部由 render() 推导。
//
// 为什么必须这样：之前的状态是"看"出来的——3 个 MutationObserver 盯着
// btnEnd.disabled、phaseLine 文本、档案卡 display 反推，外加 7 处直接改按钮。
// 结果是"现在为什么不能点发送"没有一处能单独回答，纯文字模式的状态行
// 还得靠观察器补一句"文字对话进行中"。现在事件只改 S.ui 然后调 render()，
// 每个按钮为什么是这个样子，只有一个地方能解释。
// ---------------------------------------------------------------------------
const UI_STATES = {
  idle:   { label: "未开始",          end: false, input: false, entries: true,  live: false },
  text:   { label: "文字对话进行中",   end: true,  input: true,  entries: false, live: true  },
  voice:  { label: "未开始",          end: true,  input: true,  entries: false, live: true  },
  paused: { label: "已暂停聆听",       end: true,  input: true,  entries: false, live: false },
  closed: { label: "已结束，可看「事件链」", end: false, input: false, entries: true, live: false },
};

function setUiState(state) {
  if (!UI_STATES[state]) return;
  S.ui = state;
  render();
}

function render() {
  const st = UI_STATES[S.ui] || UI_STATES.idle;
  const on = !st.entries;
  $("btnText").disabled = on;
  $("btnStart").disabled = on;
  $("btnRandom").disabled = on;
  $("btnBrowse").disabled = on;
  // 「暂停聆听」只在语音模式存在。纯文字模式根本没有麦克风，
  // 一个永远点不动的按钮比没有按钮更让人怀疑自己点错了——直接隐藏。
  const rec = $("btnRec");
  rec.hidden = !(S.ui === "voice" || S.ui === "paused");
  rec.textContent = S.ui === "paused" ? "恢复聆听" : "暂停聆听";
  $("btnEnd").disabled = !st.end;
  $("textInput").disabled = !st.input;
  $("btnSend").disabled = !st.input || !!S.busy;
  $("btnSilence").hidden = !st.input;
  // 启动区只在通话进行中收成工具栏（CSS：.launch.compact）。
  // 挂断后要退回完整入口区——closed 还收着，用户就找不到"再打一通"的按钮
  // （冒烟测试第 ⑦ 步抓到的）。
  document.querySelector(".launch").classList.toggle(
    "compact", S.ui === "text" || S.ui === "voice" || S.ui === "paused");
  const ph = $("phaseLine");
  ph.classList.toggle("live", !!st.live);
  // voice 的状态行是动态的（在听/正在处理/客服在说/即将停下），由 setPhaseLine 写；
  // 其余状态在这里一次写死——纯文字模式再也不用靠观察器补一句。
  if (S.ui !== "voice") ph.textContent = st.label;
}

// 「本次目标」常驻小牌：点了「看一份档案」、或开了会话之后，用户随时能看见
// 这一通打给谁。之前锁定关系只存在 S.pendingTarget 里，界面上只有 log 里
// 一行字——翻上去就找不到了，连抽两次档案也不知道现在锁的是哪家。
function setTargetChip(name) {
  const chip = $("targetChip");
  if (!chip) return;
  if (!name) { chip.hidden = true; return; }
  $("targetChipName").textContent = name;
  chip.hidden = false;
}

const AVATAR = { "客服": "客", "用户": "你", "系统": "·" };

initTabs();
initLogScroll();
renderTip();

function log(who, text, tag) {
  const role = who === "客服" ? "agent" : (who === "系统" ? "sys" : "user");
  const box = document.createElement("div");
  box.className = "msg " + role;
  box.innerHTML = '<div class="who">' + (AVATAR[who] || "·") + '</div><div class="bubble">' +
                  escapeHtml(text) + (tag ? '<span class="tag">' + escapeHtml(tag) + '</span>' : '') + '</div>';
  const el = $("log");
  el.appendChild(box);
  // 贴底才跟随；用户翻上去看历史时别把他拽回来，只留一个「有新消息」
  if (LOGSTICK) el.scrollTop = el.scrollHeight;
  else if ($("btnJump")) $("btnJump").hidden = false;
  if (tag) markStage(tag);
}


function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// 本次外呼目标要展示的字段：键是档案字段名，值是中文标签，
// 第三个元素为 true 表示"长文本，占整行"（驳回原因、需补材料）。

  ["company_name", "公司名称", "hl"],
  ["company_short_name", "公司简称"],
  ["company_type", "公司类型"],
  ["region", "地区"],
  ["registered_address", "注册地址", "long"],
