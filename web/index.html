  ["shop_open_date", "开店时间"],
  ["legal_representative", "法定代表人"],
  ["contact_name", "联系人"],
  ["contact_role", "联系人身份", "hl"],
  ["phone_tail", "联系电话尾号"],
  ["id_card", "身份证号"],
  ["id_card_tail", "身份证后四位"],
  ["credit_code", "统一社会信用代码"],
  ["credit_code_tail", "信用代码后四位"],
  ["bank_account_tail", "对公账户尾号"],
  ["application_id", "申请单号"],
  ["application_type", "申请类型"],
  ["brand_name", "品牌名称"],
  ["brand_registration_no", "商标注册号"],
  ["category_l1", "经营类目(一级)"],
  ["category_l2", "经营类目(二级)"],
  ["category_l3", "经营类目(三级)"],
  ["reject_code", "驳回代码"],
  ["reject_category", "驳回类别"],
  ["reject_reason", "驳回原因", "long"],
  ["required_materials", "需补充材料", "long"],
  ["recheck_deadline", "复核截止"],
  ["close_mode", "关单方式"],
  ["call_status", "外呼状态"],
];

const MATCHED_LABEL = {
  "random_test": "随机生成",
  "application_id": "指定复测",
  "outbound_list": "外呼名单",
};

// 把后端回传的外呼目标档案渲染到面板里。
// 一张档案四十多个字段，全铺开没人读得完，所以分三层：
//   ① 名字 / 联系人 / 核验尾号 —— 跟着电话走的三件事
//   ② 驳回 + 补材料 —— 客服要说的原因与要做的事
//   ③ 全部字段（折叠）—— 想深挖再点开
// company 为空（非赛题场景 / 取空）时隐藏卡片并给一句提示。
// scene = 本次随机到的驳回场景（后端用官方话术按本档案填好槽位）。
// 没有 scene 不代表出错：京麦驳回按官方口径就是走站内指引、不外呼。
const RAND_KEY = ["company_name", "shop_name", "contact_name", "contact_role",
                  "phone_tail", "id_card_tail", "reject_reason", "reject_category",
                  "reject_code", "required_materials"];

function renderRandomCompany(company, matched_by, scene) {
  const card = $("randomCard");
  const info = $("randomInfo");
  const tag = $("randomMatched");
  // 右栏空态标记：没有档案时把面板收薄（原来是观察器盯 card.style.display，
  // 现在数据一到就顺手写，不再需要 MutationObserver）。
  const empty = $("targetPanel");
  if (empty) empty.classList.toggle("is-empty", !company || typeof company !== "object");
  if (!company || typeof company !== "object") {
    card.style.display = "none";
    info.innerHTML = "";
    tag.textContent = "";
    TIP.tail = "";
    TIP.reject = "";
    setInputHint("");
    renderTip();
    return;
  }
  card.style.display = "";
  tag.textContent = MATCHED_LABEL[matched_by] || (matched_by || "");
  // 提示条要能给出"这一单"的说法，所以把真实字段留一份
  TIP.tail = company.phone_tail || "";
  TIP.reject = company.reject_reason || "";
  setInputHint(TIP.tail);
  renderTip();

  const esc = escapeHtml;
  const val = (v) => Array.isArray(v) ? v.join("、") : String(v);
  let html = "";

  // ① 谁 + 怎么核身
  html += '<div class="rname">' + esc(company.company_name || "未命名商户") + "</div>";
  const meta = [];
  if (company.shop_name) meta.push(esc(company.shop_name));
  const who = [company.contact_name, company.contact_role].filter(Boolean).join(" · ");
  if (who) meta.push(esc(who));
  if (meta.length) html += '<div class="rmeta">' + meta.join('<span class="dot">·</span>') + "</div>";

  const tail = [];
  if (company.phone_tail) tail.push("手机尾号 " + esc(company.phone_tail));
  if (company.id_card_tail) tail.push("身份证后四位 " + esc(company.id_card_tail));
  if (tail.length) {
    html += '<div class="rrow"><span class="rk">核验</span><span class="rv">' +
            tail.join("　") + "</span></div>";
  }

  // ①' 补料清单：逐条列全 + 常驻顶部。
  // 只用档案里的字段，不写死任何材料名：required_materials / recheck_deadline /
  // target_channel / hotline。字段缺了就不渲染那一行，宁可少一行也不编一句。
  const mats = [].concat(company.required_materials || []).filter(Boolean);
  if (mats.length) {
    // 截止日只认 YYYY-MM-DD。档案里有 4 条写的是「（未设定截止日·069）」这种占位文案，
    // 原样贴进来会变成「截止（未设定截止日·069）」——把占位符当日期念给客户听。
    const dlRaw = String(company.recheck_deadline || "").trim();
    const dl = /^\d{4}-\d{2}-\d{2}$/.test(dlRaw) ? dlRaw : "";
    const ch = company.target_channel ? String(company.target_channel) : "";
    const hot = company.hotline ? String(company.hotline) : "";
    html += '<div class="mat-guide"><div class="mg-head">' +
            '<span class="mg-t">这单要补这几样</span>' +
            '<span class="mg-n">' + mats.length + " 项" + (dl ? " · 截止 " + esc(dl) : "") +
            "</span></div>" +
            '<ol class="mg-list">' +
            mats.map((m, i) =>
              '<li><span class="no">' + (i + 1) + '.</span><span class="mt">' +
              esc(m) + "</span></li>").join("") +
            "</ol>" +
            '<div class="mg-foot">' +
              (ch ? "<span>提交渠道 <b>" + esc(ch) + "</b></span>" : "") +
              (hot ? "<span>不清楚拨 <b>" + esc(hot) + "</b></span>" : "") +
            "</div></div>";
  }

  // ② 为什么被驳回
  if (company.reject_reason) {
    const kind = [company.reject_category, company.reject_code].filter(Boolean).join(" · ");
    html += '<div class="rrow"><span class="rk">驳回</span><span class="rv">' +
            esc(company.reject_reason) +
            (kind ? '<span class="sub">' + esc(kind) + "</span>" : "") +
            "</span></div>";
  }

  // ②' 客服待会儿要说的话术：给测试者核对"原因到底来自哪句官方原话"
  if (scene && scene.script) {
    const from = scene.via === "reject_code" ? "按驳回代码命中" : "同业务域替身";
    html += '<div class="rq"><span class="qk">客服会这么说 · 官方 ' +
            esc(scene.id || "") + " · " + esc(from) + "</span>" +
            "<blockquote title=\"" + esc(scene.script).replace(/"/g, "&quot;") + "\">" + esc(scene.script) + "</blockquote></div>";
  } else {
    html += '<div class="rq"><span class="qk">客服会这么说</span>' +
            "<blockquote>本场景官方口径为站内指引（不外呼），没有电话话术。</blockquote></div>";
  }

  // ③ 其余字段折叠
  const rest = [];
  for (const [key, label, flag] of RAND_FIELDS) {
    if (RAND_KEY.indexOf(key) >= 0) continue;
    const v = company[key];
    if (v === undefined || v === null || v === "" ||
        (Array.isArray(v) && !v.length)) continue;
    const cls = "ri" + (flag === "long" ? " long" : "");
    const vcls = "v" + (flag === "hl" ? " hl" : "");
    rest.push('<div class="' + cls + '"><span class="k">' + esc(label) +
              '</span><span class="' + vcls + '">' + esc(val(v)) + "</span></div>");
  }
  if (rest.length) {
    html += '<details class="rmore"><summary>更多字段 ' + rest.length + ' 项</summary>' +
            '<div class="rgrid">' + rest.join("") + "</div></details>";
  }
  info.innerHTML = html;
}

// 启动时拉一次健康检查，确认后端活着
async function boot() {
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    $("sceneLine").textContent = "场景：" + d.scene + " · 服务已就绪 · 首字门槛 " + d.gate_ms + "ms";
  } catch (e) {
    $("sceneLine").textContent = "连不上服务，确认 python app.py 是否在跑";
  }
}

// 开始通话：拿 session_id 与 read_token，之后每一轮都要带它们。
// opts.random=true  → 让后端从可电话外呼的档案里随机抽一条公司作为外呼目标；
// opts.application_id=xxx → 指定某家（可复现复测）；
// 都不带 → 优先用"随机预览"锁定的公司（S.pendingTarget），再没有就走外呼名单下一条。
// opts.textOnly=true → 纯文字模式：不连麦克风、不合成/播放语音，只走打字对话。
// 命中后后端会把"本次外呼目标"档案回传，我们在右栏「外呼目标」面板展示，便于对照客服开场白。
async function startCall(opts) {
  opts = opts || {};
  // 必须在用户手势里先解锁音频；iOS Safari 的自动播放限制只在同步路径放行。
  unlockAudio();
  clearTimeout(S.hangupTimer);
  S.hangupTimer = null;
  S.terminalAt = null;
  const body = {};
  // 优先用"随机预览"锁定的公司；只有显式指定/随机时才覆盖
  if (S.pendingTarget && !opts.application_id && !opts.random) {
    body.application_id = S.pendingTarget;
  }
  if (opts.application_id) body.application_id = opts.application_id;
  if (opts.random) body.random = true;
  const textOnly = !!opts.textOnly;

  // 服务没起来时这里会抛——不接住的话，点「开始通话」页面毫无反应，
  // 只有控制台红字（11-11 评审发现）。
  // 读响应体再自己 parse：网关出错时返回的是纯文本（"socket hang up"）或 HTML，
  // 直接 r.json() 会抛 `Unexpected token 's'`，把真正的问题盖掉。
  // 11-12 线上就是被这句话挡住的：真实原因是服务端事件库损坏返回 500。
  let d = null;
  for (let attempt = 0; attempt < 2 && !d; attempt++) {
    try {
      const r = await fetch("/api/call/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) });
      const raw = await r.text();
      try { d = JSON.parse(raw); }
      catch (e) {
        setUiState("idle");
        log("系统", "服务返回的不是 JSON（HTTP " + r.status + "）：" + String(raw || "").slice(0, 120));
        return;
      }
      if (!r.ok && !d.error) { d = { error: "HTTP_" + r.status, detail: JSON.stringify(d).slice(0, 120) }; }
    } catch (e) {
      if (attempt === 1) {
        setUiState("idle");
        log("系统", "服务没连上（" + (e && e.message ? e.message : e) + "）。确认后端已启动再点一次。");
        return;
      }
      await new Promise(function (res) { setTimeout(res, 400); });
    }
  }
  if (d && d.error) {
    setUiState("idle");
    log("系统", "开单失败：" + d.error + (d.detail ? "（" + d.detail + "）" : ""));
    return;
  }
  S.sessionId = d.session_id;
  S.token = d.read_token;
  S.textOnly = textOnly;
  S.ui = textOnly ? "text" : "voice";
  S.pendingTarget = null;          // 已用于开会话，清掉；下次不重预览会走外呼名单
  // 第二通开始清屏：两通对话混在同一个框里，分不清哪句是哪通。
  // 历史不丢——「事件链」标签里有完整记录，这里只清看得见的这块。
  $("log").innerHTML = "";
  LOGSTICK = true;
  $("btnJump").hidden = true;
  $("sessionLine").textContent = "会话 " + d.session_id + (textOnly ? "（纯文字）" : "");
  $("btnEvents").disabled = false;
  render();
  const _who = (d.company && d.company.company_name) || "";
  if (_who) setTargetChip(_who);

  // 展示本次外呼目标：随机/指定/名单命中的公司档案，让测试者一眼核对。
  TIP.idx = -1;
  TIP.closed = false;
  renderRandomCompany(d.company, d.matched_by, d.scene);

  if (textOnly) {
    // 纯文字模式：不启用任何语音系统，客服回复以文字形式显示在对话区。
    $("audioLine").textContent = "纯文字模式：未启用语音系统（不连麦克风、不播放语音）。直接在下方输入框打字即可，客服会基于这一单的档案主动对话。";
    S.autoMode = false;
    S.phase = "idle";
    setUiState("text");            // 状态行「文字对话进行中」由 render() 统一写
  } else {
    wsConnect();                   // S2：实时音频通道；纯文字模式不会走到这里（也不连麦克风）
    // 连续通话：进来就把麦克风打开，用户直接说话，不用点任何按钮。
    // 采集在整个通话期间常开——播报时也要开着，否则检测不到"用户想插话"。
    A.seq = 0;                     // 新会话，帧序号从头开始（服务端也是从 0 期望）
    S.onsetHits = 0;               // 开口确认计数也要清零，否则上一轮的残留会漏进来
    try {
      await startCapture();
      S.autoMode = true;
      S.phase = "agent";           // 开场白马上要播，此期间允许被打断
      setPhaseLine();
    } catch (e) {
      S.autoMode = false;
      S.phase = "idle";
      // 拿不到麦克风就退回文字模式：界面按"能打字"渲染，
      // 别停在语音状态让人对着一个没声音的麦克风说话。
      setUiState("text");
      log("系统", "拿不到麦克风：" + (e && e.message ? e.message : e) +
          "（可用下面打字；或检查浏览器权限）");
    }
  }

  if (d.opening) {
    // 外呼由客服先开口：开场自报身份是六环节的第一环
    log("客服", d.opening, "开场");
    if (!textOnly) speak(d.opening_tts || { text: d.opening, mode: "browser" }, 0);
  }
  log("系统", textOnly
    ? "纯文字会话已建立。直接在下框输入，客服会基于这一单的档案主动发起询问。"
    : "通话已建立。直接说话即可，说完会自动提交；客服说话时可以随时插话打断。");
}

// 纯预览：随机抽一家公司展示在右栏「外呼目标」面板，**不发起通话、不创建会话**。
// 锁定的公司（application_id）存进 S.pendingTarget，供随后「纯文字测试」或「开始通话」复用，
// 这样客服就能基于"你刚预览的那家"主动发起四段式询问——即"客服也需要知道这家公司"。
async function previewRandom() {
  try {
    const r = await fetch("/api/company/random");
    const d = await r.json();
    const c = d.company;
    if (!c || typeof c !== "object") {
      log("系统", "随机取公司失败：后端未返回档案。");
      return;
    }
    S.pendingTarget = c.application_id || null;
    renderRandomCompany(c, d.matched_by, d.scene);
    // 用户主动点了「看一份档案」：这一份就是他要看的，右栏直接展开给他。
    // 通话开始时系统也会带出档案，那种情况不抢视线（renderRandomCompany 不展开）。
    openPane("targetPanel");
    setTargetChip(c.company_name || "");
    const who = (c.company_name || "") + (c.contact_role ? "（" + c.contact_role + "）" : "");
    log("系统", "已选中：" + who + "。点「文字对话」即可基于它开始。");
  } catch (e) {
    log("系统", "随机预览失败：" + (e && e.message ? e.message : e));
  }
}

// ---------------------------------------------------------------------------
// 档案浏览：按类目翻全部示例数据，挑一家再对话。
// 列表只拉一次（数据是静态 mock），切换类目是纯前端过滤；点某一行才去
// 取完整档案（含补全部件），口径与随机预览完全一致。
// ---------------------------------------------------------------------------
const BROWSE = { loaded: false, loading: false, items: [], filter: "", picked: "" };

async function toggleBrowse() {
  const box = $("browseBox");
  if (!box) return;
  if (!box.hidden) { box.hidden = true; return; }   // 再点一次收起
  box.hidden = false;
  if (!BROWSE.loaded && !BROWSE.loading) {
    BROWSE.loading = true;
    $("browseList").innerHTML = "<div class='browse-empty'>加载中…</div>";
    try {
      const r = await fetch("/api/applications");
      const d = await r.json();
      BROWSE.items = (d.items || []).filter(c => c && c.company_name);
      BROWSE.loaded = true;
    } catch (e) {
      $("browseList").innerHTML = "<div class='browse-empty'>加载失败：" + (e.message || e) + "</div>";
    }
    BROWSE.loading = false;
    renderBrowse();
  }
}

function renderBrowse() {
  const chips = $("browseChips"), list = $("browseList");
  if (!chips || !list) return;
  const cats = [...new Set(BROWSE.items.map(c => c.category_l1 || "其他"))].sort();
  chips.innerHTML = ["全部", ...cats].map(c =>
    "<button data-cat=\"" + c + "\"" + (BROWSE.filter === c ? " class=\"is-on\"" : "") + ">" +
    c + "</button>").join("");
  const rows = BROWSE.items.filter(c => !BROWSE.filter || (c.category_l1 || "其他") === BROWSE.filter);
  $("browseCount").textContent = "（" + rows.length + " 家）";
  list.innerHTML = rows.length ? rows.map(c =>
    "<button type=\"button\" class=\"browse-row" + (c.application_id === BROWSE.picked ? " is-on" : "") +
    "\" data-app=\"" + c.application_id + "\">" +
    "<span class=\"bc\">" + escapeHtml(c.company_name) + "</span>" +
    "<span class=\"bm\">" + escapeHtml(c.brand_name || "—") + " · " + escapeHtml(c.category_l1 || "—") +
    " · " + escapeHtml(c.reject_reason || "—") +
    (c.application_id === BROWSE.picked ? " · 已选" : "") + "</span></button>").join("")
    : "<div class='browse-empty'>这一类没有可外呼的档案。</div>";
}

async function pickApplication(appId) {
  if (!appId) return;
  try {
    const r = await fetch("/api/company/get?application_id=" + encodeURIComponent(appId));
    const d = await r.json();
    const c = d.company;
    if (!c || typeof c !== "object") {
      log("系统", "取档案失败：没找到 " + appId);
      return;
    }
    BROWSE.picked = appId;
    S.pendingTarget = c.application_id || null;
    renderRandomCompany(c, d.matched_by, d.scene);
    openPane("targetPanel");
    setTargetChip(c.company_name || "");
    renderBrowse();
    const who = (c.company_name || "") + (c.contact_role ? "（" + c.contact_role + "）" : "");
    log("系统", "已选中：" + who + "。点「文字对话」即可基于它开始。");
  } catch (e) {
    log("系统", "取档案失败：" + (e && e.message ? e.message : e));
  }
}

// ---------------------------------------------------------------------------
// S1 采集：AudioWorklet 分帧
// ---------------------------------------------------------------------------
// 为什么不用 MediaRecorder：它只给压缩后的 webm，拿不到原始采样点——
// 既不能切帧（做不了流式识别），也算不出能量（做不了 VAD），
// 而且服务端还得先解码才知道音频有多长。
// 现在换成：麦克风 → AudioWorklet 拿原始 PCM → 重采样 16k → 20ms 一帧 → 每 8 帧上传。

// worklet 必须作为独立模块加载，所以拼成字符串再走 Blob URL，
// 这样前端仍然只有 index.html 一个文件（不新增静态资源，部署不用改路由）。
const WORKLET_SRC = `
class PcmCollector extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;   // 一般是 48000/16000 = 3
    this.pos = 0;       // 跨 block 保留的小数位置，保证重采样连续
    this.tail = 0;      // 上一 block 的最后一个采样，拼接用
    this.frame = new Int16Array(320);  // 20ms @16k
    this.fill = 0;
    this.seq = 0;       // 帧序号，服务端靠它发现丢帧
  }
  emit(v) {
    v = v < -1 ? -1 : (v > 1 ? 1 : v);
    this.frame[this.fill++] = v < 0 ? v * 0x8000 : v * 0x7fff;
    if (this.fill === this.frame.length) {
      // 转移所有权而不是复制，主线程再拼批
      this.port.postMessage({ seq: this.seq++, pcm: this.frame.buffer }, [this.frame.buffer]);
      this.frame = new Int16Array(320);
      this.fill = 0;
    }
  }
  process(inputs) {
    const input = inputs[0];
    if (!input || input.length === 0 || !input[0]) return true;
    const n = input[0].length;
    // 下混成单声道（多声道设备取平均），契约要求 mono
    const mono = new Float32Array(n);
    for (let c = 0; c < input.length; c++) {
      const d = input[c];
      for (let i = 0; i < n; i++) mono[i] += d[i] / input.length;
    }
    // 线性插值重采样到 16k：arr[0] 是上一块的尾巴，arr[1..n] 是本块
    const arr = new Float32Array(n + 1);
    arr[0] = this.tail;
    arr.set(mono, 1);
    let p = this.pos;
    while (p < n) {                       // 需要 arr[p+1]，故 p < n
      const i = p | 0;
      const f = p - i;
      this.emit(arr[i] * (1 - f) + arr[i + 1] * f);
      p += this.ratio;
    }
    this.pos = p - n;                     // 折算到下一块坐标（下一块 arr[0] = 本块 arr[n]）
    this.tail = mono[n - 1];
    return true;
  }
}
registerProcessor('pcm-collector', PcmCollector);
`;

// 采集与上传的状态。录一轮就重置一次，避免跨轮串数据。
const A = { ctx: null, node: null, gain: null, src: null, stream: null,
            seq: 0, frames: 0, samples: 0, dropped: 0,
            batch: [], inflight: 0, queue: Promise.resolve(),
            srvFrames: 0, srvSamples: 0, srvGaps: 0 };

const BATCH_FRAMES = 8;      // 8 帧 = 160ms 一次请求，兼顾延迟与请求数
const MAX_INFLIGHT = 6;      // 网络跟不上时的背压上限，超了丢片并记账

// 开采集：拿麦克风、装 worklet、接管线
async function startCapture() {
  // 回声消除必须开。否则播报声会被麦克风收回去，VAD 以为用户在说话，
  // 结果就是每播一句都自我打断——这是 S3/S6 最容易踩的坑，源头在这里。
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true,
             noiseSuppression: true, autoGainControl: true }
  });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
  try {
    await ctx.audioWorklet.addModule(url);
  } finally {
    URL.revokeObjectURL(url);
  }
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, "pcm-collector");
  node.port.onmessage = (e) => onFrame(e.data);
  // 必须接到 destination 才会被音频图拉动；gain=0 保证不把麦克风声音放出来
  const gain = ctx.createGain();
  gain.gain.value = 0;
  src.connect(node);
  node.connect(gain);
  gain.connect(ctx.destination);

  Object.assign(A, { ctx, node, gain, src, stream,
                     frames: 0, samples: 0, dropped: 0,
                     batch: [], inflight: 0, queue: Promise.resolve(),
                     srvFrames: 0, srvSamples: 0, srvGaps: 0 });
  return { sampleRate: ctx.sampleRate };
}

// 停采集：先发完尾巴，再断开资源。返回这一轮的采集统计。
async function stopCapture() {
  if (A.node) A.node.port.onmessage = null;
  flushBatch();                    // 最后不足一批的帧也要发出去
  await A.queue;                   // 等所有分片落地，否则服务端样本数会少一截
  try {
    if (A.gain) A.gain.disconnect();
    if (A.node) A.node.disconnect();
    if (A.src) A.src.disconnect();
  } catch (e) { /* 已经断开过就忽略 */ }
  if (A.ctx) { try { await A.ctx.close(); } catch (e) { /* 同上 */ } }
  if (A.stream) A.stream.getTracks().forEach(t => t.stop());   // 及时松开麦克风

  const stat = { frames: A.frames, samples: A.samples, dropped: A.dropped };
  A.ctx = A.node = A.gain = A.src = A.stream = null;
  return stat;
}

// 收到一帧：先做 VAD 判定，再决定要不要攒进上传批次。
function onFrame(d) {
  const pcm = new Int16Array(d.pcm);
  A.frames += 1;
  A.samples += pcm.length;

  if (S.autoMode) {
    vadTick(analyzeFrame(pcm));
    // 只在"该收用户声音"的两个状态上传。思考中/播报中的音频不能进识别：
    // 播报时麦克风是开着的（要判打断），会把客服自己的声音采进来。
    if (S.phase === "listening" || S.phase === "user") {
      A.batch.push(pcm);
      if (A.batch.length >= BATCH_FRAMES) flushBatch();
    } else if (S.bargeState === "suspect") {
      // 疑似插话期间单独攒一小段，用来问"这到底是不是人话"。
      // 千万不能进 A.batch：那会把客服自己的播报声混进本轮识别。
      S.bargeBuf.push(pcm);
    }
  }
  updateAudioLine();
}

// 一帧 PCM16 的均方根，归一到 0~1。320 个采样，一秒 50 次，开销可以忽略。
function frameRms(pcm) {
  let sum = 0;
  for (let i = 0; i < pcm.length; i++) {
    const v = pcm[i] / 32768;
    sum += v * v;
  }
  return Math.sqrt(sum / pcm.length);
}

// 单频点能量（Goertzel）。只要几个频点，比做 FFT 便宜一个量级。
function goertzel(pcm, freq, sr) {
  const coeff = 2 * Math.cos(2 * Math.PI * freq / sr);
  let s0 = 0, s1 = 0, s2 = 0;
  for (let i = 0; i < pcm.length; i++) {
    s0 = pcm[i] / 32768 + coeff * s1 - s2;
    s2 = s1;
    s1 = s0;
  }
  const e = s1 * s1 + s2 * s2 - coeff * s1 * s2;
  return e > 0 ? e : 0;
}

// 频段能量 = 几个频点的均值。
// **这里之前写成"单点 400Hz / 单点 2000Hz"，那是错的**：20ms 窗的频率分辨率
// 只有 50Hz，单点测的是"这个精确频率上有没有能量"，跟基频/共振峰落在哪强相关。
// 女声基频 200Hz 附近、400Hz 上恰好是谷，tilt 就掉到 0.1 以下，真人被判成键盘。
// 换成每侧三个点取均值后，测的是"这一带整体有多亮"，才对得上注释里的"谱倾斜"。
const LOW_BAND = [300, 500, 700];
const HIGH_BAND = [1800, 2400, 3000];

function bandSum(pcm, freqs, sr) {
  let e = 0;
  for (let i = 0; i < freqs.length; i++) e += goertzel(pcm, freqs[i], sr);
  return e / freqs.length;
}

// 一帧特征。与 scripts/tune_barge_vad.py 的 analyze_frame() 必须保持一致——
// 那边用同一套判据在语料上标定参数，两边不一致就等于标定了个寂寞。
function analyzeFrame(pcm) {
  const rms = frameRms(pcm);
  let zc = 0, prev = pcm[0];
  for (let i = 1; i < pcm.length; i++) {
    const v = pcm[i];
    if ((v >= 0) !== (prev >= 0)) zc += 1;
    prev = v;
  }
  const zcr = pcm.length > 1 ? zc / (pcm.length - 1) : 0;
  const tilt = bandSum(pcm, LOW_BAND, 16000) / (bandSum(pcm, HIGH_BAND, 16000) + 1e-12);
  // voiced 只回答"这一帧像不像人在说话"，用于**开口确认**和打断探针。
  const voiced = rms >= VAD.speechRms && zcr <= VAD.zcrMax && tilt >= VAD.tiltMin;
  return { rms, zcr, tilt, voiced };
}

// VAD 状态推进。每个 20ms 帧调一次，是整套连续对话的心脏。
function vadTick(f) {
  // 状态刚从别处切回 listening 时，开口计数必须清零：
  // 否则上一轮残留的 1 帧会让"下一帧像人声"立刻判成开口，
  // 等于把 40ms 的确认门悄悄关掉。
  if (S.prevPhase !== S.phase) {
    if (S.phase === "listening") S.onsetHits = 0;
    S.prevPhase = S.phase;
  }
  if (S.phase === "agent") {
    agentTick(f);
    return;
  }
  if (S.phase === "thinking") return;         // 等响应，不判任何东西

  if (S.phase === "listening") {
    // 开口要连续几帧"像人声"：键盘单帧很响但谱不对，40ms 才认。
    S.onsetHits = f.voiced ? S.onsetHits + 1 : 0;
    if (S.onsetHits >= VAD.onsetFrames) {
      S.phase = "user";
      S.silentFrames = 0;
      S.onsetHits = 0;
      setPhaseLine();
    }
    if (VAD_DEBUG) updateAudioLine(f);
    return;
  }

  if (S.phase === "user") {
    // 「还在说」用**能量**判，不用 voiced。
    // 之前这里写的是 `if (f.voiced) silentFrames = 0`，是个真 bug：
    // voiced 里含过零率和谱倾斜两个门，用户说到一半侧个头、换个字音、
    // 音量略降，zcr/tilt 一不达标就被当成静音，700ms 一到直接把一句话切成两半。
    // 端点只该回答「还有没有声音」，不该用"像不像人声"去判。
    // （silenceRms 之前定义了却从来没用过——这个死参数就是那条 bug 的证据。）
    if (f.rms >= VAD.silenceRms) S.silentFrames = 0;
    else S.silentFrames += 1;
    if (S.silentFrames >= VAD.endpointFrames) {
      // 端点到了：用户说完了，自动提交，不需要按任何按钮
      S.phase = "thinking";
      setPhaseLine();
      // T0 = 说完了的那一刻，必须在等上传落地之前取
      const t0 = performance.now();
      // S2：通道在线走协议推送（服务端主动回结果与语音）；
      // 不在线回落 HTTP 轮。两条路的差别只在运输，业务事件完全一样。
      if (!wsSendTurn(t0)) {
        sendTurn({ audio_streamed: true, audio_dropped: A.dropped }, t0);
      }
    }
    if (VAD_DEBUG) updateAudioLine(f);
  }
}

// 播报中每帧调一次。这里分两段判定，别把它压成"能量超了就算打断"。
//
// 为什么必须两段：实测发现 60ms 的咳嗽、碰麦、椅子响就能把客服打断，
// 而打断是不可逆的——那半句话用户再也听不到了，得重听一遍。
// 所以能量只当"疑似"，真正停播要等这段说完、识别出实义文字。
// 代价是"客服多说了半句"，但这在半双工电话里听起来像正常的反应延迟。
function agentTick(f) {
  const rms = f.rms;                        // 快门仍用能量+谱特征，见下方空闲分支
  if (VAD_DEBUG) updateAudioLine(f);
  if (S.bargeState === "probing") return;   // 正在识别，等结果，别重复触发

  if (S.bargeState === "suspect") {
    // 已经在疑似状态：等这段说完（静音 360ms）或者攒满 3.2 秒
    // 端点只看能量：中途换个字音、音量略降时不能把一句话切成两半。
    if (rms >= VAD.silenceRms) S.silentFrames = 0;
    else S.silentFrames += 1;
    S.bargeHits += 1;
    if (S.silentFrames >= VAD.probeSilenceFrames ||
        S.bargeHits >= VAD.bargeMaxFrames) {
      confirmBargeIn();
    }
    return;
  }

  // 空闲：连续 5 帧（100ms）既超阈值又"像人声"才进疑似。
  // 只看能量时，键盘瞬态/椅子响/咳嗽都会让客服音量掉下去；
  // 谱特征门（voiced）与开口检测同源，能挡住这些非语音瞬态。
  const hit = rms >= VAD.bargeRms && f.voiced;
  S.bargeHits = hit ? S.bargeHits + 1 : 0;
  if (S.bargeHits >= VAD.bargeFrames) startBargeSuspect();
}

// 疑似插话：先压低播报音量，开始攒音频。**不暂停**。
// 为什么用压低而不是暂停：万一是我误判（多半是），暂停再恢复会有一个
// 明显的断音，而音量压下去再抬回来，用户几乎察觉不到。
function startBargeSuspect() {
  S.bargeState = "suspect";
  S.bargeBuf = [];
  S.silentFrames = 0;
  S.bargeHits = 0;
  S.bargeStartedAt = performance.now();   // 打断响应从这里开始计时
  duckPlayback(true);
  setPhaseLine();
}

// 这段说完了，拿去识别：到底是不是在说话、说的是什么。
async function confirmBargeIn() {
  const frames = S.bargeBuf;
  S.bargeBuf = [];
  S.bargeState = "probing";

  if (!frames.length) {
    dismissBargeIn("没攒到音频");
    return;
  }

  let total = 0;
  for (const f of frames) total += f.length;
  const merged = new Int16Array(total);
  let off = 0;
  for (const f of frames) { merged.set(f, off); off += f.length; }

  let d = null;
  try {
    const q = "?session_id=" + encodeURIComponent(S.sessionId) +
              "&token=" + encodeURIComponent(S.token) +
              "&agent_text=" + encodeURIComponent(S.agentText || "");
    const r = await fetch("/api/asr/probe" + q, {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: merged.buffer
    });
    d = await r.json();
  } catch (e) {
    dismissBargeIn("识别请求失败");
    return;
  }

  if (d && d.has_content) {
    doBargeIn(d.text || "", frames);
  } else {
    dismissBargeIn(d && d.text ? "只听到「" + d.text + "」，不算插话" : "没识别出内容");
  }
}

// 否决：这不是插话。抬回音量继续播，就当没发生过。
function dismissBargeIn(why) {
  S.bargeState = "idle";
  S.bargeBuf = [];
  S.silentFrames = 0;
  S.bargeHits = 0;
  duckPlayback(false);
  setPhaseLine();
  if (why) log("系统", "疑似插话已忽略：" + why);
}

// 确认打断：到这里才真的让客服闭嘴。
// 顺序很重要——先停播再发通知。网络请求可以慢，但"闭嘴"不能慢。
function doBargeIn(heardText, preBuf) {
  if (S.phase !== "agent") return;
  // 打断响应有两个口径，别混：
  //   duck_ms：从检测到人声到音量压下去（用户"感觉"客服让路了）
  //   stop_ms：到真的停声（含等说完 + 识别确认，必然更慢）
  // 验收写的"≤300ms 停声"，指的是前者；后者做不到 300ms——
  // 要等用户把话说完才能识别出文字，这是原理决定的，不是实现偷懒。
  const now = performance.now();
  const stopMs = S.bargeStartedAt ? Math.round(now - S.bargeStartedAt) : 0;
  S.bargeState = "idle";
  S.bargeBuf = [];
  S.bargeHits = 0;
  S.silentFrames = 0;
  stopPlayback();
  // 插话开头那几个字（"等一下""不是"）不能丢：用户是连着往下说的，
  // 把这段接到本轮缓冲的最前面，等他说完一起识别。
  if (preBuf && preBuf.length) {
    for (const f of preBuf) A.batch.push(f);
  }
  S.phase = "user";              // 用户已经在说话了，直接进 user 继续收
  log("系统", "打断：听到「" + (heardText || "") + "」，客服已停止播报");
  setPhaseLine();
  // 通知服务端记 barge_in、丢掉这一轮没播完的音频。
  // S2：通道在线走协议事件（服务端同时清缓冲），否则走原来的 HTTP。
  if (WS.sock && WS.started && WS.sock.readyState === 1) {
    WS.sock.send(JSON.stringify({ type: "barge_in", heard: heardText || "",
                                  latency_ms: stopMs }));
  } else {
    const sid = S.sessionId, tok = S.token, tid = S.turnId;
    fetch("/api/call/barge_in", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sid, token: tok, turn_id: tid,
                             reason: "user_speech", text: heardText || "",
                             latency_ms: stopMs })
    }).catch(() => {});
  }
}

// 压低/恢复播报音量。分段播放时每段是新的 Audio 对象，
// 所以 playNext / speak 里都要按 S.ducked 补一次音量。
function duckPlayback(on) {
  S.ducked = !!on;
  const a = S.currentAudio;
  if (a) {
    try { a.volume = on ? VAD.duckVolume : 1.0; } catch (e) { /* 某些浏览器只读 */ }
  }
}

// 立刻停掉正在播的声音，并让所有待播队列失效
function stopPlayback() {
  S.playToken += 1;              // 队列里每一段都会检查这个值，变了就不再播
  S.ducked = false;
  if (S.currentAudio) {
    try { S.currentAudio.pause(); } catch (e) { /* 已经停了 */ }
    S.currentAudio = null;
  }
  if ("speechSynthesis" in window) speechSynthesis.cancel();
}

// 播报结束（正常播完）：回到聆听，并清掉播报期间采到的音频
function afterPlayback() {
  if (S.phase !== "agent") return;      // 被打断过就别再改状态
  S.phase = "listening";
  S.silentFrames = 0;
  S.bargeHits = 0;
  // 播完时如果还卡在"疑似"里（用户刚好在最后一刻出声），一并清掉：
  // 客服已经说完了，这时候再确认插话没有意义，只会把用户拖进一次空轮。
  S.bargeState = "idle";
  S.bargeBuf = [];
  S.ducked = false;
  S.agentText = "";
  setPhaseLine();
  // 播报期间麦克风一直开着（为了能打断），这段音频里混着客服自己的声音，
  // 不清掉的话下一轮识别会把它们当成用户说的话。
  const sid = S.sessionId, tok = S.token;
  fetch("/api/audio/reset", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: sid, token: tok })
  }).catch(() => {});
}

function setPhaseLine() {
  let label = { idle: "未开始", listening: "在听，请讲",
                user: "正在听你说", thinking: "正在处理",
                agent: "客服在说，可打断" }[S.phase] || S.phase;
  // 补一句"正在确认"：不然用户会觉得"我说话了但客服没停"，其实是在识别。
  if (S.bargeState === "suspect") label = "即将停下";
  else if (S.bargeState === "probing") label = "正在确认";
  const el = $("phaseLine");
  if (el) el.textContent = label;
  // 按钮与圆点统一交给 render()：voice 状态下它不动这行文字，只点亮圆点。
  render();
}

// 把攒着的帧合成一片发出去。seq 用"这批第一帧的序号"，
// 服务端靠它判断有没有中间丢片（帧号不跳是 S1 的验收标准）。
function flushBatch() {
  if (!A.batch.length) return;
  const frames = A.batch;
  A.batch = [];
  let total = 0;
  for (const f of frames) total += f.length;
  const merged = new Int16Array(total);
  let off = 0;
  for (const f of frames) { merged.set(f, off); off += f.length; }

  const seq = A.seq;
  A.seq += frames.length;

  if (!S.sessionId) return;          // 还没开始通话，直接把音频丢掉
  // S2：通道开着就直接推二进制帧——单条 TCP 有序到达，不需要 seq，
  // 也不需要并发窗口。通道没起来（老服务端/握手失败）走原来的 HTTP 分片，
  // 两种路线喂的是同一个服务端缓冲，随时切换不打架。
  if (WS.sock && WS.started && WS.sock.readyState === 1) {
    WS.sock.send(merged.buffer);
    A.srvFrames += frames.length;
    A.srvSamples += merged.length;
    updateAudioLine();
    return;
  }
  if (A.inflight >= MAX_INFLIGHT) {
    // 背压：宁可丢片并记账，也不要把内存堆爆。
    // 丢片会让服务端看到 seq 缺口——这是故意的，掩盖丢片才是错的。
    A.dropped += frames.length;
    updateAudioLine();
    return;
  }
  A.inflight += 1;
  // 串行发送：保证到达顺序，也避免 seq 乱序被误判成丢片
  A.queue = A.queue.then(() => uploadChunk(seq, merged)).catch(() => {});
}

// 上传一片音频。失败不抛给用户，但要留痕（否则会以为"没声音"是麦克风坏了）
async function uploadChunk(seq, pcm16) {
  try {
    const q = "?session_id=" + encodeURIComponent(S.sessionId) +
              "&token=" + encodeURIComponent(S.token) +
              "&seq=" + seq + "&rate=16000";
    const r = await fetch("/api/audio/chunk" + q, {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: pcm16.buffer
    });
    const d = await r.json();
    if (d.ok) {
      A.srvFrames = d.received_frames;
      A.srvSamples = d.received_samples;
      A.srvGaps = d.gaps;
    } else {
      log("系统", "音频分片被拒：" + (d.error || r.status) +
          (d.detail ? "（" + d.detail + "）" : ""));
    }
  } catch (e) {
    log("系统", "音频分片上传失败：" + e.message);
  } finally {
    A.inflight -= 1;
    updateAudioLine();
  }
}

// 采集状态条：这是 S1 唯一能"眼看为实"的地方
function updateAudioLine(f) {
  if (!S.autoMode && !A.frames) return;
  const parts = ["采集 " + A.frames + " 帧 / " + A.samples +
                 " 采样（" + (A.samples / 16000).toFixed(2) + " 秒）"];
  if (A.srvSamples) parts.push("服务端已收 " + A.srvSamples + " 采样");
  if (A.srvGaps) parts.push("序号缺口 " + A.srvGaps + " 次");
  if (A.dropped) parts.push("本地丢帧 " + A.dropped);
  // 现场标定：看得到才能调。这三个数分别对应"够不够响""是不是噪声""偏高频吗"。
  if (VAD_DEBUG && f) {
    parts.push("rms=" + f.rms.toFixed(3) + (f.rms >= VAD.speechRms ? "✓" : "·"));
    parts.push("zcr=" + f.zcr.toFixed(2) + (f.zcr <= VAD.zcrMax ? "✓" : "·"));
    parts.push("tilt=" + f.tilt.toFixed(2) + (f.tilt >= VAD.tiltMin ? "✓" : "·"));
    parts.push(f.voiced ? "判人声" : "非人声");
  }
  $("audioLine").textContent = parts.join(" · ");
}

// 连续通话下这个按钮不再是"录音"，而是暂停/恢复聆听。
// 为什么还留一个暂停键：演示时要停下来讲解、环境太吵想先关麦，
// 真电话上的"静音键"也是这个作用。
async function toggleRec() {
  if (!S.sessionId) return;

  if (S.autoMode) {
    S.autoMode = false;
    S.phase = "idle";
    stopPlayback();
    await stopCapture();
    $("audioLine").textContent = "已暂停聆听（麦克风已关闭）";
    setUiState("paused");
    log("系统", "已暂停聆听。点「恢复聆听」继续；也可以直接在下面打字。");
    return;
  }

  try {
    await startCapture();
    S.autoMode = true;
    S.phase = "listening";
    setUiState("voice");
    setPhaseLine();
    log("系统", "已恢复聆听，直接说话即可。");
  } catch (e) {
    log("系统", "拿不到麦克风：" + (e && e.message ? e.message : e) + "（可改用下面打字）");
  }
}

// 一轮对话：把音频或文字发给后端，拿回回复并播报。
// t0 由调用方给：语音轮是"说完那一刻"（在等上传之前取），文字轮是"点发送那一刻"。
async function sendTurn(payload, t0) {
  if (!S.sessionId || S.busy) return;
  S.busy = true;
  render();
  // T0：用户"说完 / 点发送"的时刻。首字响应从这里算到第一帧声音。
  S.t0 = t0 || performance.now();
  try {
    const r = await fetch("/api/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      // text_only 告诉服务端"这一轮不会放音"：纯文字模式下服务端就不再合成 TTS。
      // 不传的话，服务端仍会等合成（实测 0.3–8.0 秒），而前端 `if (!S.textOnly)`
      // 根本不会播——首字超 2 秒的时间全花在没人听的音频上。
      body: JSON.stringify(Object.assign(
        { session_id: S.sessionId, token: S.token, text_only: !!S.textOnly }, payload))
    });
    const d = await r.json();
    if (d.error) { log("系统", "出错了：" + d.error + (d.detail ? "（" + d.detail + "）" : "")); return; }

    log("用户", d.user_text || "（无应答）");
    log("客服", d.reply_text, d.next_stage);
    if (d.tool_result) {
      log("系统", "工具调用：" + JSON.stringify(d.tool_result) + (d.closed ? "（已闭环并回写）" : ""));
    }
    if (d.compliance && d.compliance.blocked) {
      log("系统", "⚠ 合规护栏命中禁语：" + d.compliance.hits.join("、") + "，已整句替换");
    }

    S.turnId = d.turn_id;
    $("mTotal").textContent = d.latency.total_ms + " ms";
    // 进入"客服说话"状态：从这一刻起麦克风转成"监听打断"用途
    if (S.autoMode) {
      S.phase = "agent";
      S.bargeHits = 0;
      setPhaseLine();
    }
    if (!S.textOnly) speak(d.tts || { text: d.reply_text, mode: "browser" }, d.turn_id);
    // 收线判据必须与服务端 should_auto_hangup 一致：hangup 只覆盖终态
    // 两个出口，挂断/打错/核身失败/转专员等 15 个出口只有 end_reason。
    // 只判 d.hangup 会让这些路径说完「再见」仍不挂断（PR43 实测）。
    // 语音走 WS 时服务端自己收；纯文字走 HTTP，只能前端定时收。
    if (d.hangup || d.end_reason) {
      // 第一次终态信号锁定绝对截止；后续 ACK 轮只重排到同一个点，
      // 不让「嗯/好的/对」把挂断无限推后（与服务端 ws_channel 同口径）。
      if (!S.terminalAt) S.terminalAt = Date.now() + 2500;
      clearTimeout(S.hangupTimer);
      S.hangupTimer = setTimeout(() => {
        S.hangupTimer = null;
        if (S.sessionId) endCall();
      }, Math.max(0, S.terminalAt - Date.now()));
    }
    refreshMetrics();
    refreshEvents();
  } catch (e) {
    log("系统", "请求失败：" + e.message);
    if (S.autoMode) { S.phase = "listening"; setPhaseLine(); }
  } finally {
    S.busy = false;
    render();
    // 兜底：这一轮如果没能进入播报（出错、空回复），别让状态卡死在"思考中"，
    // 否则 VAD 再也不会推进，用户会觉得"它不理我了"。
    if (S.autoMode && S.phase === "thinking") {
      S.phase = "listening";
      setPhaseLine();
    }
  }
}

// ---- 移动端 Safari 语音解锁 ---------------------------------------------
// iOS Safari 不允许页面在没有用户手势时主动 play()。原来的处理是每次失败
// 都打一行「自动播放被拦截，改用浏览器播报」，截图里连出 5 行——客服其实
// 一句也没念出来。现在改成：首次手势里放一段静音解锁音频，失败才弹按钮。
const SILENT_WAV = "data:audio/wav;base64,UklGRmQBAABXQVZFZm10IBAAAAABAAEAQB8AAIA+AAACABAAZGF0YUABAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==";

function isAutoplayBlocked(err) {
  const name = (err && err.name) || "";
  const msg = String((err && err.message) || err || "");
  return name === "NotAllowedError" || name === "NotSupportedError"
      || /autoplay|user gesture|play\(\) failed/i.test(msg);
}

function showAudioUnlockButton(why) {
  const b = $("btnEnableAudio");
  if (b) b.hidden = false;
  if (!S.audioUnlockPrompted) {
    S.audioUnlockPrompted = true;
    log("系统", why || "浏览器拦截了自动播放，请点「点此开启语音播报」。");
  }
}

function hideAudioUnlockButton() {
  const b = $("btnEnableAudio");
  if (b) b.hidden = true;
}

// 必须在用户手势的同步路径里调用（按钮 click 里直接调，别 await 之后再调）。
function unlockAudio() {
  if (S.audioUnlocked) return Promise.resolve(true);
  try {
    const Ctx = window.AudioContext || window.webkitAudioContext;
    if (Ctx) {
      if (!S.audioCtx) S.audioCtx = new Ctx();
      if (S.audioCtx.state === "suspended") S.audioCtx.resume();
    }
  } catch (e) { /* 没有 WebAudio 也继续试静音音频 */ }
  try {
    if (!S.audioUnlockEl) {
      S.audioUnlockEl = new Audio(SILENT_WAV);
      S.audioUnlockEl.preload = "auto";
    }
    return S.audioUnlockEl.play().then(() => {
      S.audioUnlocked = true;
      hideAudioUnlockButton();
      replayAfterUnlock();
      return true;
    }).catch(() => false);
  } catch (e) {
    return Promise.resolve(false);
  }
}

// 被拦截时把这一轮存下来，用户点完按钮直接重播，不要求他再说一遍。
function replayAfterUnlock() {
  if (S.pendingSpeak) {
    const p = S.pendingSpeak;
    S.pendingSpeak = null;
    speak(p.tts, p.turnId);
  }
  if (S.pendingWs) {
    const p = S.pendingWs;
    S.pendingWs = null;
    WSP.queue.unshift(...p.queue);
    WSP.text = p.text;
    WSP.rate = p.rate;
    wsPlayNext();
  }
}

// 播报：服务端合成好音频就播它，没合成成功才退回浏览器自带 TTS。
// 首字响应在这里测量：onplaying / onstart 触发时才是"用户真的听到声音"。
// 注意这个数现在**包含云 TTS 的合成耗时**——那才是真实的端到端首字。
function speak(tts, turnId) {
  const t0 = S.t0;
  const text = (tts && tts.text) || "";
  let reported = false;
  const report = (estimate) => {
    if (reported) return;
    reported = true;
    reportMetric(turnId, performance.now() - t0, estimate);
  };

  const rate = Number((tts && tts.rate) || 1.05);
  S.agentText = text;                    // 回声比对用（见 confirmBargeIn）

  // 分段合成路线：第一段先出声，后面的段自动接上。
  // 服务端把长回复按"句末标点优先"切成短头段 + 若干尾段，
  // 首字不用再等整句念完；头段不再落在 3 字的「您好，」上。
  if (tts && tts.mode === "segments" && Array.isArray(tts.segments) && tts.segments.length) {
    playSegments(tts, turnId, report, text);
    return;
  }

  // 服务端整句合成路线：<audio> 播 OSS 链接。不 fetch，所以不受 CORS 限制。
  if (tts && tts.mode === "url" && tts.audio_url) {
    const a = new Audio(tts.audio_url);
    a.preload = "auto";
    a.playbackRate = rate;                // 与云端合成同速，回落/切段不突变
    S.currentAudio = a;                       // 留个句柄，打断时要能 pause
    if (S.ducked) a.volume = VAD.duckVolume;  // 疑似插话期间新起一段也要保持压低
    a.onplaying = () => report(false);
    a.onended = () => { S.currentAudio = null; afterPlayback(); };
    a.onerror = (e) => {
      if (isAutoplayBlocked(e)) { S.pendingSpeak = { tts, turnId }; showAudioUnlockButton(); return; }
      log("系统", "音频播放失败，改用浏览器播报"); browserSpeak(text, report, rate);
    };
    a.play().catch((e) => {
      if (isAutoplayBlocked(e)) { S.pendingSpeak = { tts, turnId }; showAudioUnlockButton(); return; }
      log("系统", "音频播放失败，改用浏览器播报"); browserSpeak(text, report, rate);
    });
    return;
  }

  browserSpeak(text, report, rate);
}

// 顺序播放分段音频。第一段出声就算"首字响应"。
// 服务端只等第一段就返回响应，剩下的段落在后台合成；这里播完首段再去取，
// 所以用户听到声音的时间不再取决于整句话有多长。
// 任何一段失败就整体回落浏览器播报——只播半句话比不播更难解释。
function playSegments(tts, turnId, report, fallbackText) {
  const queue = (tts.segments || []).slice();
  const rate = Number(tts.rate || 1.05);
  const myToken = S.playToken;      // 打断时 playToken 会 +1，这里记住当初的值
  let restCount = tts.rest_count || 0;
  let reported = false;
  let aborted = false;

  // 被用户打断之后，这个队列必须整体作废——不能"停一下再接着念"
  const barged = () => myToken !== S.playToken;

  const fallback = (why, err) => {
    if (aborted || barged()) return;
    if (isAutoplayBlocked(err)) {
      // 一句都没播出来才重放整轮；已经播过前半段就不回头，避免重复。
      if (!reported) S.pendingSpeak = { tts, turnId };
      showAudioUnlockButton();
      return;
    }
    aborted = true;
    log("系统", "分段音频播放失败，改用浏览器播报");
    browserSpeak(fallbackText, report, rate);
  };

  const playNext = () => {
    if (aborted || barged()) return;

    if (!queue.length) {
      // 队列空了：还有剩余段就去取一次，取到接着播
      if (restCount > 0) {
        restCount = 0;
        fetchRestSegments(turnId).then((segs) => {
          if (aborted || barged()) return;
          if (segs.length) { queue.push(...segs); playNext(); }
          else afterPlayback();          // 取不到就直接收尾，别卡着
        });
      } else {
        afterPlayback();                 // 全部播完，回到聆听
      }
      return;
    }

    const seg = queue.shift();
    const a = new Audio(seg.audio_url);
    a.preload = "auto";
    a.playbackRate = rate;
    S.currentAudio = a;
    if (S.ducked) a.volume = VAD.duckVolume;  // 切段时也要保持压低
    a.onplaying = () => { if (!reported) { reported = true; report(false); } };
    a.onended = () => { S.currentAudio = null; playNext(); };
    a.onerror = (e) => fallback("分段音频播放失败", e);
    a.play().catch((e) => fallback("自动播放被拦截", e));
  };

  playNext();
}

// 取剩余段。失败就当作没有——少播一句也不能让播报卡死在那里。
async function fetchRestSegments(turnId) {
  if (!S.sessionId || !S.token) return [];
  try {
    const r = await fetch("/api/tts/rest?session_id=" + encodeURIComponent(S.sessionId) +
                          "&token=" + encodeURIComponent(S.token) +
                          "&turn_id=" + encodeURIComponent(turnId));
    if (!r.ok) return [];
    const d = await r.json();
    return Array.isArray(d.segments) ? d.segments : [];
  } catch (e) { return []; }
}

// 降级路线：浏览器 speechSynthesis。音色机械，但保证"有声音"。
function browserSpeak(text, report, rate) {
  if (!("speechSynthesis" in window)) {
    report(true);
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = Number(rate || 1.05);   // 与云端请求同口径，不再写死 1.05
  u.onstart = () => report(false);
  // 播完要回到聆听状态。被打断时 cancel() 也会触发 onend，
  // 但那时 phase 已经是 user，afterPlayback 里的判断会把它挡掉。
  u.onend = () => afterPlayback();
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  // 兜底：个别浏览器不触发 onstart，1.5 秒后按"已开始播报"记一条估算值。
  // 宁可标 estimated，也不要让面板空着——空着会让人以为没在测。
  setTimeout(() => report(true), 1500);
}

// 把浏览器实测的首字响应回传给服务端，聚合口径才有一手数据
async function reportMetric(turnId, ms, estimate) {
  if (!turnId || !S.sessionId) return;
  const val = Math.round(ms);
  $("mFirst").textContent = val + (estimate ? " ms（估算）" : " ms");
  try {
    await fetch("/api/turn/metric", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: S.sessionId, token: S.token,
        turn_id: turnId, first_audio_ms: val, estimate: estimate
      })
    });
  } catch (e) { /* 上报失败不影响通话，聚合时按服务端下界计入 */ }
  refreshMetrics();
}

async function endCall(opts) {
  clearTimeout(S.hangupTimer);
  S.hangupTimer = null;
  S.terminalAt = null;
  if (!S.sessionId) return;
  const silent = !!(opts && opts.silent);   // 服务端已收线时不重复 POST
  // 挂断时先把状态机停掉，再关麦克风：否则正在播的声音会继续，
  // 而 VAD 还在拿"已结束会话"的音频做判定。
  S.autoMode = false;
  S.phase = "idle";
  S.pendingSpeak = null;
  S.pendingWs = null;
  hideAudioUnlockButton();
  stopPlayback();
  if (WS.sock) { try { WS.sock.close(); } catch (e) { /* 已断 */ } WS.sock = null; WS.started = false; }
  $("liveSubtitle").textContent = "";
  if (A.node) {
    await stopCapture();
    $("audioLine").textContent = "麦克风已关闭。";
  }
  if (!silent) {
    await fetch("/api/call/end", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: S.sessionId, token: S.token })
    });
  }
  log("系统", "通话已结束。");
  TIP.closed = true;
  // 会话句柄清掉，但**事件链还能看**：提示条说「事件链标签里有完整记录」。
  // refreshEvents 在下面调用时会话还活着，先拉一份快照存进 S.lastEvents；
  // 挂断之后再点「刷新」，用的就是这份快照（服务端 end_call 会把会话删掉，
  // 活着时不用快照、挂断后查不到，这是一条死路——11-11 评审抓到的）。
  setUiState("closed");
  refreshEvents();               // 挂断瞬间把最终事件链拉好，不用用户再点刷新
  refreshMetrics();
  S.sessionId = null;
  S.token = null;
}

async function refreshMetrics() {
  try {
    const r = await fetch("/api/metrics");
    const d = await r.json();
    const p95 = d.first_audio_p95_ms ? d.first_audio_p95_ms + " ms" : "样本不足";
    $("mPct").textContent = d.first_audio_samples
      ? d.first_audio_p50_ms + " / " + p95
      : "— （暂无语音样本）";
    $("mClosed").textContent = d.closed_sessions + " 通（共 " + d.turns + " 轮）";

    const bits = [];
    bits.push("语音样本 " + d.first_audio_samples + (d.first_audio_estimated ? "（其中估算 " + d.first_audio_estimated + "）" : ""));
    bits.push("超时 " + d.first_audio_timeouts);
    if (d.first_audio_text_samples) bits.push("打字轮参考 P50 " + d.first_audio_text_p50_ms + "ms（不计入门槛）");
    bits.push("处理耗时 P50 " + d.processing_p50_ms + "ms");
    bits.push("估算成本 ¥" + d.est_cost_cny);
    $("metricNote").textContent = "门槛 " + d.gate_ms + "ms · " + bits.join(" · ");
  } catch (e) { /* 指标拉取失败不影响通话 */ }
}

async function refreshEvents() {
  // 挂断后：服务端已删会话（end_call 里 pop），再查只会 UNKNOWN_SESSION——
  // 用挂断瞬间缓存的快照（endCall 会在会话还活着时先拉一次）。
  if (!S.sessionId) {
    if (S.lastEvents) $("events").textContent = S.lastEvents;
    return;
  }
  try {
    const url = "/api/events?session_id=" + encodeURIComponent(S.sessionId) +
                "&token=" + encodeURIComponent(S.token);
    const r = await fetch(url);
    const d = await r.json();
    if (d.error) { $("events").textContent = "读取失败：" + d.error; return; }
    const text = (d.events || []).map(e =>
      "#" + String(e.id).padStart(3, "0") + "  turn " + e.turn_id + "  " +
      e.type.padEnd(14) + " " + (e.latency_ms ? e.latency_ms + "ms" : "") +
      "\n     " + JSON.stringify(e.payload)
    ).join("\n") || "还没有事件。";
    $("events").textContent = text;
    S.lastEvents = text;
  } catch (e) { /* 忽略 */ }
}

// ===== S2：WebSocket 双向通道（角色 1）=====
// 三件事：音频帧直推（不再 HTTP 分片）、结果与语音"就绪即推"（不再轮询
// /api/tts/rest）、打断变协议事件。通道任何一步失败都整体回落 HTTP 路线，
// S1 的行为不受影响——S2 坏了不能把 S1 也带坏。
const WS = { sock: null, started: false, rtReady: false };

function wsConnect() {
  if (WS.sock) { try { WS.sock.close(); } catch (e) { /* 已经断了 */ } }
  WS.started = false;
  try {
    const proto = location.protocol === "https:" ? "wss://" : "ws://";
    const s = new WebSocket(proto + location.host + "/ws/call");
    s.binaryType = "arraybuffer";
    WS.sock = s;
    s.onopen = () => {
      // start 必须在音频之前：服务端要先验 token 才肯收帧
      s.send(JSON.stringify({ type: "start", session_id: S.sessionId, token: S.token }));
    };
    s.onmessage = (ev) => {
      let m; try { m = JSON.parse(ev.data); } catch (e) { return; }
      wsOnMessage(m);
    };
    s.onclose = () => { WS.started = false; };
    s.onerror = () => { /* 回落由 readyState 判断；这里不打扰用户 */ };
  } catch (e) {
    log("系统", "实时通道建不起来，继续用 HTTP 分片：" + e.message);
  }
}

function wsOnMessage(m) {
  switch (m.type) {
    case "ready":
      WS.started = true;
      WS.rtReady = !!m.realtime;
      log("系统", "实时通道已建立（S2）" + (WS.rtReady ? "，流式字幕开启" : "") + "。");
      // 流式没起来要说清原因：演示现场"字幕不出"最常见的三个原因是
      // 没密钥、模型没开通、公司网拦 WSS。不讲原因就只能干猜。
      if (!WS.rtReady && m.realtime_error) {
        log("系统", "流式字幕未启用，回落整段识别：" + m.realtime_error, "降级");
      }
      return;
    case "turn_result":
      handleWsTurnResult(m);
      return;
    case "tts":
      wsOnTts(m);
      return;
    case "tts_done":
      WSP.done = true;
      wsPlayNext();
      return;
    case "turn_end":
      if (m.latency) $("mTotal").textContent = Math.round(m.latency.total_ms) + " ms";
      refreshMetrics(); refreshEvents();
      return;
    case "call_ended":
      // 服务端说完结束语后主动收线。这里不能直接调 endCall()：
      // 它还会 POST /api/call/end，服务端已经记过一次，会重复记账。
      log("系统", "通话已结束（" + (m.reason || "done") + "），服务端已收线。");
      endCall({ silent: true });
      return;
    case "barge_ack":
      return;                       // 服务端已记账；停播在前端早已完成
    case "partial":
      // 流式识别的半句字幕：只给演示者看，不进对话日志——
      // 半句随时会被整句取代，进了日志反而像"客服听错了"。
      $("liveSubtitle").textContent = m.text || "";
      return;
    case "pong":
      return;
    case "error":
      // 一轮在服务端失败：必须把状态放回去，否则前端永远卡在"思考中"
      if (m.code === "TURN_FAILED" || m.code === "TURN_BUSY") {
        S.busy = false;
        if (S.phase === "thinking") { S.phase = "listening"; setPhaseLine(); }
      }
      log("系统", "通道消息被拒：" + m.code + "（" + (m.detail || "") + "）");
      return;
  }
}

// 服务端推回的一轮文字结果。展示逻辑与 sendTurn 相同，只是运输路线不同。
function handleWsTurnResult(m) {
  S.turnId = m.turn_id;
  S.busy = false;
  // 半句字幕到此为止：整句已经落在下面的对话日志里，字幕再留着就是同一句
  // 出现两遍（这就是验收里说的"不重复"）。
  $("liveSubtitle").textContent = "";
  render();
  log("用户", m.user_text || "（无应答）");
  log("客服", m.reply_text, m.next_stage);
  if (m.tool_result) {
    log("系统", "工具调用：" + JSON.stringify(m.tool_result) +
        (m.closed ? "（已闭环并回写）" : ""));
  }
  refreshEvents();
}

// WS 语音轮提交。返回 true 表示已走通道；false 表示通道不可用，调用方回落 HTTP。
function wsSendTurn(t0) {
  if (!WS.started || !WS.sock || WS.sock.readyState !== 1) return false;
  S.busy = true;
  S.t0 = t0;
  WSP.queue = []; WSP.done = false; WSP.reported = false; WSP.playing = false; WSP.text = ""; WSP.rate = 1.05;
  WS.sock.send(JSON.stringify({ type: "turn" }));
  return true;
}

// ===== WS 语音播放队列：段就绪即播，与 HTTP 版 playSegments 平行 =====
// 为什么要平行实现：HTTP 版的队列是"一次拿一包"，WS 版的段是分批到达的，
// 硬塞进同一个函数会让两条路线互相耦合，坏一处坏一双。
const WSP = { queue: [], done: false, playing: false, reported: false, text: "", rate: 1.05 };

function wsOnTts(m) {
  if (m.mode === "browser") {
    // 服务端合成失败回落：用浏览器念。与 HTTP 版的 browserSpeak 同源。
    const myToken = S.playToken;
    log("客服", m.text, "（浏览器播报）");
    if (S.phase !== "agent") { S.phase = "agent"; setPhaseLine(); }
    browserSpeak(m.text, (est) => {
      if (myToken !== S.playToken) return;
      reportMetric(m.turn_id, performance.now() - S.t0, est);
    }, m.rate);
    return;
  }
  WSP.text = m.text || WSP.text;
  WSP.rate = Number(m.rate || WSP.rate || 1.05);
  if (S.phase !== "agent") { S.phase = "agent"; S.bargeHits = 0; setPhaseLine(); }
  if (m.audio_url) WSP.queue.push(m);
  wsPlayNext();
}

function wsPlayNext() {
  if (WSP.playing) return;
  const seg = WSP.queue.shift();
  if (seg) {
    WSP.playing = true;
    const myToken = S.playToken;
    const barged = () => myToken !== S.playToken;   // 被打断的队列整体作废
    const fallback = (why, err) => {
      WSP.playing = false;
      if (barged()) return;
      if (isAutoplayBlocked(err)) {
        if (!WSP.reported) {
          S.pendingWs = { queue: [seg, ...WSP.queue], text: WSP.text, rate: WSP.rate };
        }
        showAudioUnlockButton();
        return;
      }
      log("系统", why + "，改用浏览器播报");
      browserSpeak(WSP.text, (est) => reportMetric(seg.turn_id, performance.now() - S.t0, est), seg.rate || WSP.rate);
    };
    const a = new Audio(seg.audio_url);
    a.preload = "auto";
    a.playbackRate = Number(seg.rate || WSP.rate || 1.05);
    S.currentAudio = a;
    if (S.ducked) a.volume = VAD.duckVolume;        // 插话疑似期新起段也保持压低
    a.onplaying = () => {
      if (!WSP.reported) {
        WSP.reported = true;
        reportMetric(seg.turn_id, performance.now() - S.t0, false);
      }
    };
    a.onended = () => {
      S.currentAudio = null;
      WSP.playing = false;
      if (barged()) return;
      wsPlayNext();
    };
    a.onerror = (e) => fallback("分段音频播放失败", e);
    a.play().catch((e) => fallback("自动播放被拦截", e));
    return;
  }
  if (WSP.done) {
    WSP.done = false; WSP.reported = false; WSP.text = ""; WSP.rate = 1.05;
    $("liveSubtitle").textContent = "";
    afterPlayback();
  }
}

// ===========================================================================
// 现场校准模式（地址加 ?vadcal=1）
//
// 为什么要有这个：离线语料是 TTS 合成的、噪声是我用 math 拼的，在那上面怎么调
// 都全过；但真正决定演示成败的是这台机器的**扬声器→房间→麦克风→浏览器 AEC**
// 这一整条链。链上有多少残余回声、底噪多高、设备频响偏多少，离线一个都测不到。
// 这个模式就在真实链路上采四个阶段的逐帧特征，导出一份 JSON，
// 再交给 scripts/fit_vad_from_calib.py 算建议阈值。
//
// 四个阶段刻意覆盖了会上翻车的四种情况：
//   静音 · 外放自己的播报 · 用户说话 · 敲键盘
// ===========================================================================
const VADCAL = /[?&]vadcal=1/.test(location.search);

const CAL_LINE = "您好，我是京东商家资质审核的工作人员，您这边提交的营业执照经营范围与店铺主营类目不一致，需要您补充说明一下。";
const CAL_READ = "我这边已经上传了新的营业执照，你看看能不能过。";

function vadCalPanel() {
  const box = document.createElement("div");
  box.id = "vadcal";
  box.style.cssText = "position:fixed;right:16px;bottom:16px;width:360px;z-index:9999;" +
    "background:#fff;border:1px solid #d8dee8;border-radius:10px;padding:12px 14px;" +
    "box-shadow:0 8px 28px rgba(0,0,0,.14);font:13px/1.6 system-ui,sans-serif;color:#1b2430";
  box.innerHTML =
    '<b style="font-size:14px">现场 VAD 校准</b>' +
    '<div style="color:#5b6b7c;margin:4px 0 8px">约 22 秒，四步：静音 → 外放播报 → 你说话 → 敲键盘。' +
    '请确保用的是<b>扬声器</b>不是耳机，音量正常。</div>' +
    '<button id="vcStart">开始</button> <button id="vcSave" disabled>下载 JSON</button>' +
    '<div id="vcStep" style="margin-top:8px;font-weight:600;min-height:22px"></div>' +
    '<pre id="vcLog" style="margin:8px 0 0;max-height:150px;overflow:auto;' +
    'background:#f5f7fa;border-radius:6px;padding:6px;font-size:11px;white-space:pre-wrap"></pre>';
  document.body.appendChild(box);
  $("vcStart").onclick = () => runVadCal();
  $("vcSave").onclick = () => saveVadCal();
}

let _calRows = [];
let _calMeta = {};

function vcLog(s) { $("vcLog").textContent += s + "\n"; $("vcLog").scrollTop = 1e9; }
function vcStep(s) { $("vcStep").textContent = s; }

async function runVadCal() {
  $("vcStart").disabled = true;
  _calRows = [];
  const rows = _calRows;
  let phase = "prep";

  let stream, ctx, node;
  try {
    stream = await navigator.mediaDevices.getUserMedia({
      audio: { channelCount: 1, echoCancellation: true,
               noiseSuppression: true, autoGainControl: true }
    });
  } catch (e) {
    vcStep("拿不到麦克风：" + e.message);
    $("vcStart").disabled = false;
    return;
  }

  ctx = new (window.AudioContext || window.webkitAudioContext)();
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
  try { await ctx.audioWorklet.addModule(url); } finally { URL.revokeObjectURL(url); }
  const src = ctx.createMediaStreamSource(stream);
  node = new AudioWorkletNode(ctx, "pcm-collector");
  const gain = ctx.createGain();
  gain.gain.value = 0;
  src.connect(node); node.connect(gain); gain.connect(ctx.destination);

  const t0 = performance.now();
  node.port.onmessage = (e) => {
    const f = analyzeFrame(new Int16Array(e.data.pcm));
    rows.push({ t: Math.round(performance.now() - t0), ph: phase,
                rms: +f.rms.toFixed(5), zcr: +f.zcr.toFixed(3), tilt: +f.tilt.toFixed(2) });
  };

  const wait = (ms) => new Promise(r => setTimeout(r, ms));

  // ① 静音
  phase = "silence";
  vcStep("① 静音 4 秒 · 请别说话");
  await wait(4000);

  // ② 外放自己的播报（浏览器 TTS，走的是同一套喇叭→麦克风路径）
  phase = "echo";
  if (window.speechSynthesis) {
    vcStep("② 正在外放一句客服话术，请别跟着念");
    const u = new SpeechSynthesisUtterance(CAL_LINE);
    u.lang = "zh-CN";
    speechSynthesis.speak(u);
    await wait(7000);
    speechSynthesis.cancel();
  } else {
    vcLog("[跳过] 这个浏览器没有 speechSynthesis");
  }

  // ③ 用户说话
  phase = "voice";
  vcStep("③ 请念这句话：「" + CAL_READ + "」");
  await wait(6000);

  // ④ 敲键盘
  phase = "keytap";
  vcStep("④ 请敲键盘 5 秒（正常力度）");
  await wait(5000);

  phase = "done";
  node.port.onmessage = null;
  try { stream.getTracks().forEach(t => t.stop()); } catch (e) { /* 已经关了 */ }
  try { await ctx.close(); } catch (e) { /* 同上 */ }

  const n = {};
  for (const r of rows) n[r.ph] = (n[r.ph] || 0) + 1;
  _calMeta = {
    ua: navigator.userAgent,
    saved_at: new Date().toISOString(),
    front_params: VAD,
    counts: n
  };
  vcStep("完成，共 " + rows.length + " 帧（" + JSON.stringify(n) + "）→ 点「下载 JSON」");
  vcLog("把 JSON 放到 data/vad_calib/ 下，跑 python scripts/fit_vad_from_calib.py");
  $("vcSave").disabled = false;
}

function saveVadCal() {
  const payload = JSON.stringify({ meta: _calMeta, rows: _calRows });
  const a = document.createElement("a");
  a.href = URL.createObjectURL(new Blob([payload], { type: "application/json" }));
  a.download = "vadcal_" + Date.now() + ".json";
  a.click();
  setTimeout(() => URL.revokeObjectURL(a.href), 3000);
}

if (VADCAL) vadCalPanel();

// 训练回放：对抗客户 vs 客服
//
// 数据来自 POST /api/train/run：后端真跑一场（独立事件库 + 强制模板话术），
// 返回逐轮轨迹。这里只负责播放，不改任何业务状态。
// 为什么要逐轮播而不是一次性铺开：训练的价值在「哪一轮露怯、难度什么时候涨」，
// 一次性铺开就只剩一堆气泡，看不出因果。
// ---------------------------------------------------------------------------
const TRAIN_ACT = {
  answer_company: "报公司名", answer_tail: "报尾号", answer_name: "报姓名",
  answer_order: "报单号", cant_remember: "记不住", ask_why: "质疑来电",
  ask_material: "问材料", ask_fee: "问收费", refuse_info: "拒绝提供",
  reask_already_told: "重复已给信息", mishear: "说没听清", off_topic: "跑题",
  deny: "说没听懂", confirm: "明确确认", ack: "嗯", yes_company: "确认本人",
  no_wrong_person: "说打错了", hangup: "挂断"
};
const TRAIN_WEAK = {
  repeat: "客服复读同一句", no_answer: "问题没被正面回答",
  slot_loss: "已给信息又被要一遍", vague_ref: "核身指代含糊",
  noise_on_question: "把提问当杂音", premature: "没听懂就回写",
  stalled: "连续停在同一个要求"
};

function trainSleep(ms) { return new Promise(r => setTimeout(r, ms)); }

// 画像清单。顺手把"这个画像这次会坐到哪家店"记住：

// 谁看都能一眼对上"他说的品牌"和"客服查到的品牌"是不是一回事。
let TRAIN_P = [];

async function loadTrainPersonas() {

async function runTrain() {
  const pid = $("trainPersona").value;
  if (!pid) return;
  const mode = $("trainUser").value;
  $("btnTrain").disabled = true;
  $("trainState").textContent = mode === "llm" ? "训练中…20–40 秒" : "训练中…5–15 秒";
  $("trainFlow").innerHTML = "";
  $("trainSummary").innerHTML = "";
  try {
    const r = await fetch("/api/train/run", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ persona_id: pid, user: mode })
    });
    const d = await r.json();
    if (d.error) {
      $("trainState").textContent = d.error + "：" + (d.detail || "");
      return;
    }
    await playTrain(d);
  } catch (e) {
    $("trainState").textContent = "训练失败：" + e;
  } finally {
    $("btnTrain").disabled = false;
  }
}

async function playTrain(d) {
  const flow = $("trainFlow");
  const turns = d.turns || [];
  if (!turns.length) {
    $("trainState").textContent = "没有对话";
    renderTrainSummary(d);
    return;
  }
  for (let i = 0; i < turns.length; i++) {
    const u = turns[i].user || {};
    const a = turns[i].agent || {};
    const found = (u.found || []).map(w => TRAIN_WEAK[w] || w);
    const tags = [];
    if (u.source) tags.push('<span class="spbadge ' + (u.source === "llm" ? "llm" : "rule") + '">' +
      (u.source === "llm" ? "模型" : (d.user_mode === "llm" ? "回退" : "规则")) + "</span>");
    if (u.feel) tags.push('<span class="spbadge">' + escapeHtml(u.feel) + "</span>");
    if (u.veto) tags.push('<span class="spbadge rule">拦:' + escapeHtml(u.veto) + "</span>");
    const div = document.createElement("div");
    div.className = "tl";
    div.innerHTML =
      '<div class="tmeta"><span class="lvl">L' + (u.level || 1) + "</span>第 " + (i + 1) +
      " 轮 · 客户：" + escapeHtml(TRAIN_ACT[u.action] || u.action || "") +
      (found.length ? '<span class="weak">露怯：' + escapeHtml(found.join(" / ")) + "</span>" : "") +
      "</div>" +
      '<div class="msg"><div class="who">客户</div><div class="bubble">' +
      escapeHtml(u.text || "") + '<span class="m">' + tags.join("") + "</span></div></div>" +
      '<div class="msg"><div class="who">客服</div><div class="bubble agent">' +
      escapeHtml(a.reply_text || "") + '<span class="tag">' +
      escapeHtml((a.stage || "") + "→" + (a.next_stage || "")) + "</span></div></div>";
    flow.appendChild(div);
    flow.scrollTop = flow.scrollHeight;
    $("trainState").textContent = "播放中… " + (i + 1) + "/" + turns.length;
    await trainSleep(520);
  }
  $("trainState").textContent = "播放完";
  renderTrainSummary(d);
}

function renderTrainSummary(d) {
  const w = d.weakness || {};
  const cells = Object.keys(TRAIN_WEAK).map(k =>
    '<div class="weakcell"><div class="k">' + escapeHtml(TRAIN_WEAK[k]) +
    '</div><div class="v">' + (w[k] || 0) + "</div></div>").join("");
  // 判定与文案必须同源：以前"期望"是前端用 d.expect.closed === true 推的，
  // 画像没写 expect 时会印出"期望不闭环"却判"失败"，自相矛盾。
  const want = (d.expect_closed === null || d.expect_closed === undefined)
    ? "未约定" : (d.expect_closed ? "闭环" : "不闭环");
  // 复读：相邻两轮客服回复几乎逐字相同。这是用户一眼就能看出来的毛病，
  // 结果里必须自己报出来，而不是等人截图指出来。
  const rt = d.turns || [];
  let rep = 0;
  for (let i = 1; i < rt.length; i++) {
    const a = (rt[i - 1].agent || {}).reply_text || "";
    const b = (rt[i].agent || {}).reply_text || "";
    if (a && b && (a === b || a.slice(0, 18) === b.slice(0, 18))) rep++;
  }
  // 客户侧到底是谁在说话，要写在结果里而不是只写在提示里：
  // 模型扮演时通数不可复现，引用这些数字的人得知道这一点。
  const sim = d.sim_report || {};
  let who = "客户侧：规则模板（与跑批闸门同一世界，可复现）";
  if (d.user_mode === "llm") {
    who = "客户侧：模型 " + escapeHtml(d.llm_model || "") + "｜调用 " +
      (sim.llm_calls || 0) + " 次，通过 " + (sim.llm_ok || 0) + " 次" +
      (sim.vetoes && sim.vetoes.length
        ? "，被打回 " + sim.vetoes.length + " 次（" +
          escapeHtml(sim.vetoes.slice(0, 3).map(v => v.reason).join("、")) + "）"
        : "") + "｜覆盖率 " + Math.round((sim.coverage || 0) * 100) + "%" +
      "（打回的那几句退回规则原话，不算模型说的）";
  }
  $("trainSummary").innerHTML =
    '<div class="verdict ' + (d.ok ? "ok" : "bad") + '">判定：' + escapeHtml(d.verdict || "") +
    "（期望" + want + "，实际" + (d.closed ? "闭环" : "不闭环") + "）· 难度峰值 L" +
    (d.level_peak || 1) + " · 结束于 " + escapeHtml(d.end_by || "") + "</div>" +
    '<div class="weakgrid">' + cells + "</div>" +
    '<div class="hint" style="margin-top:6px">客服复读相邻两轮：' + rep + " 次" +
    (rep ? '　<span class="weak">这一项不为 0 就是缺陷</span>' : "") + "</div>" +
    '<div class="hint" style="margin-top:8px">' + who +
    "。这一场露出的弱点就是自进化的输入：失败簇 → 候选话术 → 闸门，训练用独立事件库、不写生产数据。</div>";
}

$("btnTrain").onclick = runTrain;
$("trainPersona").onchange = trainTarget;
loadTrainPersonas();

// ---------------------------------------------------------------------------
// 自进化训练日志：多轮「反馈 → 改一处 → 复跑」的记录
//
// 数据来自 GET /api/evolve/runs 与 /api/evolve/run?id=，都是只读快照。
// 这里刻意把「改了什么、哪条判据没过」铺开：只看曲线会以为在进步，
// 看判据才知道某处改动其实是拆东墙补西墙被退回的。
// ---------------------------------------------------------------------------
const EV_CODE = {
  repeat: "复读上一句", no_answer: "问题没被回答", generic_summary: "复述丢了具体原因",
  slot_loss: "已给信息又被要一遍", noise_on_question: "把提问当杂音",
  placeholder: "播出占位符", stalled: "原地打转"
};
let _evolveBusy = false;

function evCodes(o) {
  const ks = Object.keys(o || {});
  if (!ks.length) return "—";
  return ks.map(k => (EV_CODE[k] || k) + " " + o[k]).join("、");
}

async function loadEvolveRuns(keep) {
  try {
    const r = await fetch("/api/evolve/runs");
    const d = await r.json();
    const sel = $("evolveRun");
    const old = sel.value;
    sel.innerHTML = "";
    (d.runs || []).forEach(x => {
      const o = document.createElement("option");
      o.value = x.run_id;
      o.textContent = x.run_id + "｜" + (x.at || "") + "｜负面 " +
        (x.neg ? x.neg.join("→") : "-") + "｜" + x.rounds + " 轮";
      sel.appendChild(o);
    });
    if (!sel.options.length) {
      $("evolveState").textContent = "无记录";
      // 没有记录时那个空下拉框会把整行撑歪，直接收起来，只留「跑 3 轮」
      sel.style.display = "none";
      $("btnEvolveView").disabled = true;
      return;
    }
    sel.style.display = "";
    $("btnEvolveView").disabled = false;
    if (keep && old) sel.value = old;
    $("evolveState").textContent = "共 " + sel.options.length + " 次运行";
  } catch (e) {
    $("evolveState").textContent = "训练记录加载失败：" + e;
  }
}

async function viewEvolve() {
  const id = $("evolveRun").value;
  if (!id) return;
  $("evolveState").textContent = "读取中…";
  try {
    const r = await fetch("/api/evolve/run?id=" + encodeURIComponent(id));
    const d = await r.json();
    if (d.error) { $("evolveState").textContent = d.error + "：" + (d.detail || ""); return; }
    renderEvolve(d);
    $("evolveState").textContent = "已加载";
  } catch (e) {
    $("evolveState").textContent = "读取失败：" + e;
  }
}

function renderEvolve(run) {
  const b = run.base_metrics || {};
  const f = run.final_metrics || {};
  const rows = (run.rounds || []).map(rd => {
    const m = (rd.after || {}).metrics || {};
    const att = rd.attempt || {};
    const tag = att.decision === "accepted"
      ? '<span class="evtag ok">采纳</span>'
      : (att.decision ? '<span class="evtag no">退回</span>' : "");
    return '<tr' + (rd.round === (run.rounds || []).length ? ' class="latest"' : '') + '>' +
      "<td>第 " + rd.round + " 轮</td>" +
      "<td>" + (m.neg == null ? "—" : m.neg) + "</td>" +
      "<td>" + (m.pos == null ? "—" : m.pos) + "</td>" +
      "<td>" + (m.pass ? m.pass.ok + "/" + m.pass.total : "—") + "</td>" +
      "<td>" + escapeHtml(att.adjustment || "—") + tag + "</td>" +
      "<td>" + escapeHtml(att.why || "") + "</td></tr>";
  }).join("");

  const details = (run.rounds || []).map(rd => {
    const att = rd.attempt;
    if (!att) return "";
    const checks = (att.checks || []).map(c =>
      '<div class="evcheck">[' + (c.pass ? "通过" : "不过") + '] <b>' +
      escapeHtml(c.name) + "</b>：" + escapeHtml(c.detail) + "</div>").join("");
    const cl = (rd.clusters || []).slice(0, 2).map(c => {
      const ex = (c.examples || []).map(e =>
        '<div class="evquote">' + escapeHtml(e.session) + " 第 " + e.turn + " 轮｜客户：" +
        escapeHtml(e.user) + "｜客服：" + escapeHtml(e.agent) + "</div>").join("");
      return '<div class="evwhy">簇 ' + escapeHtml(c.target) + "（" + c.count + " 条｜" +
        evCodes(c.codes) + "）</div>" + ex;
    }).join("");
    return '<div class="evround"><div class="evwhy">第 ' + rd.round + " 轮：" +
      escapeHtml(att.decision === "accepted" ? "采纳 " : "退回 ") + escapeHtml(att.adjustment) +
      (att.reason ? "（" + escapeHtml(att.reason) + "）" : "") + "</div>" +
      checks + cl + "</div>";
  }).join("");

  const codeOnly = (run.code_only || []).length
    ? '<div class="hint" style="margin-top:10px">只能改代码、闭环没有自动动的缺陷：' +
      run.code_only.map(c => escapeHtml(c.key) + "×" + c.count).join("、") + "</div>"
    : "";

  $("evolveBody").innerHTML =
    '<div class="verdict ' + ((f.neg != null && b.neg != null && f.neg <= b.neg) ? "ok" : "bad") + '">' +
    "负面反馈 " + (b.neg == null ? "—" : b.neg) + " → " + (f.neg == null ? "—" : f.neg) +
    " 条｜正面 " + (b.pos == null ? "—" : b.pos) + " → " + (f.pos == null ? "—" : f.pos) +
    "｜通过 " + (b.pass ? b.pass.ok + "/" + b.pass.total : "—") + " → " +
    (f.pass ? f.pass.ok + "/" + f.pass.total : "—") + "</div>" +
    '<div class="hint" style="margin-top:4px">学到的策略：' +
    escapeHtml(run.policy_desc || "无") + "（配置 " + escapeHtml(run.base_sha || "") +
    " → " + escapeHtml((run.final_sha || "").slice(0, 16)) + "）</div>" +
    '<table class="evtable" style="margin-top:10px"><thead><tr><th>轮次</th><th>负面</th>' +
    "<th>正面</th><th>通过</th><th>调整</th><th>为什么改这里</th></tr></thead><tbody>" +
    rows + "</tbody></table>" + details + codeOnly +
    '<div class="hint" style="margin-top:8px">训练只写运行记录；上线需人工执行 ' +
    "python scripts/self_evolve.py promote " + escapeHtml(run.run_id) + " --yes</div>";
}

async function runEvolve() {
  if (_evolveBusy) return;
  _evolveBusy = true;
  $("btnEvolveRun").disabled = true;
  $("evolveState").textContent = "跑 3 轮…约 30 秒";
  try {
    const r = await fetch("/api/evolve/train", {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ rounds: 3 })
    });
    const d = await r.json();
    if (d.error) { $("evolveState").textContent = d.error + "：" + (d.detail || ""); return; }
    await loadEvolveRuns(false);
    if (d.run && d.run.run_id) {
      $("evolveRun").value = d.run.run_id;
      renderEvolve(d.run);
      $("evolveState").textContent = "完成";
    } else {
      $("evolveState").textContent = "完成（无记录）";
    }
  } catch (e) {
    $("evolveState").textContent = "训练失败：" + e;
  } finally {
    _evolveBusy = false;
    $("btnEvolveRun").disabled = false;
  }
}

$("btnEvolveView").onclick = viewEvolve;
$("btnEvolveRun").onclick = runEvolve;
loadEvolveRuns(false).then(() => { if ($("evolveRun").options.length) viewEvolve(); });

</script>
