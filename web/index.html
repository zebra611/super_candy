<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>super_candy · 哑链路</title>
<style>
  :root {
    --bg: #f6f6f4; --card: #ffffff; --line: #e3e2dd;
    --ink: #1f1f1d; --muted: #6b6a65; --blue: #185fa5; --blue-bg: #e6f1fb;
    --amber: #854f0b; --amber-bg: #faeeda; --gray-bg: #f1efe8;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; background: var(--bg); color: var(--ink);
    font-family: "Microsoft YaHei", "PingFang SC", system-ui, sans-serif;
    font-size: 14px; line-height: 1.6;
  }
  .wrap { max-width: 860px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 18px; font-weight: 500; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 10px; padding: 14px 16px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
  button {
    font: inherit; padding: 8px 16px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--line); background: #fff; color: var(--ink);
  }
  button:hover { border-color: #c9c8c2; }
  button.primary { background: var(--blue); border-color: var(--blue); color: #fff; }
  button.danger { background: #fff; border-color: #e0b4b4; color: #a32d2d; }
  button:disabled { opacity: .45; cursor: not-allowed; }
  input[type=text] {
    flex: 1; min-width: 200px; font: inherit; padding: 8px 12px;
    border: 1px solid var(--line); border-radius: 8px; background: #fff; color: var(--ink);
  }
  #log { min-height: 220px; max-height: 420px; overflow-y: auto; }
  .msg { display: flex; gap: 8px; margin-bottom: 10px; }
  .who { flex: 0 0 46px; color: var(--muted); font-size: 12px; padding-top: 2px; }
  .bubble { flex: 1; padding: 8px 12px; border-radius: 8px; background: var(--gray-bg); }
  .bubble.agent { background: var(--blue-bg); color: #0c447c; }
  .bubble.sys { background: #fff; border: 1px dashed var(--line); color: var(--muted); font-size: 12px; }
  .tag { display: inline-block; font-size: 11px; padding: 1px 6px; border-radius: 4px; background: var(--amber-bg); color: var(--amber); margin-left: 6px; }
  .meters { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .meter { background: var(--gray-bg); border-radius: 8px; padding: 10px 12px; }
  .meter .k { font-size: 11px; color: var(--muted); }
  .meter .v { font-size: 17px; font-weight: 500; }
  #metricNote { color: var(--muted); font-size: 11px; margin-top: 8px; }
  #events { font-family: Consolas, monospace; font-size: 11px; color: var(--muted); white-space: pre-wrap; max-height: 240px; overflow-y: auto; }
  .hint { color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <h1>super_candy · 外呼数字员工哑链路</h1>
  <div class="sub" id="sceneLine">正在连接服务…</div>

  <div class="card">
    <div class="row">
      <button id="btnStart" class="primary">开始通话</button>
      <button id="btnRec" disabled>按下说话</button>
      <button id="btnEnd" disabled class="danger">挂断</button>
      <span class="hint" id="sessionLine">未开始</span>
    </div>
    <div class="row" style="margin-top:10px">
      <input type="text" id="textInput" placeholder="没有麦克风就打字；留空直接点发送 = 模拟用户不说话" disabled>
      <button id="btnSend" disabled>发送</button>
    </div>
    <div class="hint" id="audioLine" style="margin-top:8px">麦克风未启用。点「按下说话」开始采集，20ms 一帧、16kHz 单声道。</div>
  </div>

  <div class="card">
    <div id="log"></div>
  </div>

  <div class="card">
    <div class="meters">
      <div class="meter"><div class="k">本轮首字响应（T4−T0）</div><div class="v" id="mFirst">—</div></div>
      <div class="meter"><div class="k">本轮处理耗时（服务端）</div><div class="v" id="mTotal">—</div></div>
      <div class="meter"><div class="k">首字 P50 / P95（语音轮）</div><div class="v" id="mPct" style="font-size:13px">—</div></div>
      <div class="meter"><div class="k">闭环通话数</div><div class="v" id="mClosed">—</div></div>
    </div>
    <div id="metricNote">门槛 2000ms。首字口径要等第一通语音电话才有样本。</div>
  </div>

  <div class="card">
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <strong style="font-weight:500">事件链（这通电话到底发生了什么）</strong>
      <button id="btnEvents" disabled>刷新</button>
    </div>
    <div id="events">还没有事件。</div>
  </div>
</div>

<script>
// 全部状态放这里，避免到处找变量。
// token 是这通电话的读取凭证：没有它，别人拿到 session_id 也查不到事件与报告。
const S = { sessionId: null, token: null, recording: false, busy: false, turnId: 0, t0: 0 };

const $ = (id) => document.getElementById(id);

function log(who, text, tag) {
  const box = document.createElement("div");
  box.className = "msg";
  const cls = who === "客服" ? "bubble agent" : (who === "系统" ? "bubble sys" : "bubble");
  box.innerHTML = '<div class="who">' + who + '</div><div class="' + cls + '">' +
                  escapeHtml(text) + (tag ? '<span class="tag">' + escapeHtml(tag) + '</span>' : '') + '</div>';
  $("log").appendChild(box);
  $("log").scrollTop = $("log").scrollHeight;
}

function escapeHtml(s) {
  return String(s).replace(/[&<>]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]));
}

// 启动时拉一次健康检查，确认后端活着
async function boot() {
  try {
    const r = await fetch("/api/health");
    const d = await r.json();
    $("sceneLine").textContent = "场景：" + d.scene + " · 服务已就绪 · 首字门槛 " + d.gate_ms + "ms";
  } catch (e) {
    $("sceneLine").textContent = "连不上服务，确认 python app.py 是否在跑";
  }
}

// 开始通话：拿 session_id 与 read_token，之后每一轮都要带它们
async function startCall() {
  const r = await fetch("/api/call/start", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
  const d = await r.json();
  S.sessionId = d.session_id;
  S.token = d.read_token;
  $("sessionLine").textContent = "会话 " + d.session_id;
  $("btnStart").disabled = true;
  $("btnRec").disabled = false;
  $("btnEnd").disabled = false;
  $("textInput").disabled = false;
  $("btnSend").disabled = false;
  $("btnEvents").disabled = false;
  if (d.opening) {
    // 外呼由客服先开口：开场自报身份是六环节的第一环
    log("客服", d.opening, "开场");
    speak(d.opening_tts || { text: d.opening, mode: "browser" }, 0);
  }
  log("系统", "通话已建立。说一句或打一句话，系统会按环节推进；留空点发送可以模拟“用户不说话”。");
}

// ---------------------------------------------------------------------------
// S1 采集：AudioWorklet 分帧
// ---------------------------------------------------------------------------
// 为什么不用 MediaRecorder：它只给压缩后的 webm，拿不到原始采样点——
// 既不能切帧（做不了流式识别），也算不出能量（做不了 VAD），
// 而且服务端还得先解码才知道音频有多长。
// 现在换成：麦克风 → AudioWorklet 拿原始 PCM → 重采样 16k → 20ms 一帧 → 每 8 帧上传。

// worklet 必须作为独立模块加载，所以拼成字符串再走 Blob URL，
// 这样前端仍然只有 index.html 一个文件（不新增静态资源，部署不用改路由）。
const WORKLET_SRC = `
class PcmCollector extends AudioWorkletProcessor {
  constructor() {
    super();
    this.ratio = sampleRate / 16000;   // 一般是 48000/16000 = 3
    this.pos = 0;       // 跨 block 保留的小数位置，保证重采样连续
    this.tail = 0;      // 上一 block 的最后一个采样，拼接用
    this.frame = new Int16Array(320);  // 20ms @16k
    this.fill = 0;
    this.seq = 0;       // 帧序号，服务端靠它发现丢帧
  }
  emit(v) {
    v = v < -1 ? -1 : (v > 1 ? 1 : v);
    this.frame[this.fill++] = v < 0 ? v * 0x8000 : v * 0x7fff;
    if (this.fill === this.frame.length) {
      // 转移所有权而不是复制，主线程再拼批
      this.port.postMessage({ seq: this.seq++, pcm: this.frame.buffer }, [this.frame.buffer]);
      this.frame = new Int16Array(320);
      this.fill = 0;
    }
  }
  process(inputs) {
    const input = inputs[0];
    if (!input || input.length === 0 || !input[0]) return true;
    const n = input[0].length;
    // 下混成单声道（多声道设备取平均），契约要求 mono
    const mono = new Float32Array(n);
    for (let c = 0; c < input.length; c++) {
      const d = input[c];
      for (let i = 0; i < n; i++) mono[i] += d[i] / input.length;
    }
    // 线性插值重采样到 16k：arr[0] 是上一块的尾巴，arr[1..n] 是本块
    const arr = new Float32Array(n + 1);
    arr[0] = this.tail;
    arr.set(mono, 1);
    let p = this.pos;
    while (p < n) {                       // 需要 arr[p+1]，故 p < n
      const i = p | 0;
      const f = p - i;
      this.emit(arr[i] * (1 - f) + arr[i + 1] * f);
      p += this.ratio;
    }
    this.pos = p - n;                     // 折算到下一块坐标（下一块 arr[0] = 本块 arr[n]）
    this.tail = mono[n - 1];
    return true;
  }
}
registerProcessor('pcm-collector', PcmCollector);
`;

// 采集与上传的状态。录一轮就重置一次，避免跨轮串数据。
const A = { ctx: null, node: null, gain: null, src: null, stream: null,
            seq: 0, frames: 0, samples: 0, dropped: 0,
            batch: [], inflight: 0, queue: Promise.resolve(),
            srvFrames: 0, srvSamples: 0, srvGaps: 0 };

const BATCH_FRAMES = 8;      // 8 帧 = 160ms 一次请求，兼顾延迟与请求数
const MAX_INFLIGHT = 6;      // 网络跟不上时的背压上限，超了丢片并记账

// 开采集：拿麦克风、装 worklet、接管线
async function startCapture() {
  // 回声消除必须开。否则播报声会被麦克风收回去，VAD 以为用户在说话，
  // 结果就是每播一句都自我打断——这是 S3/S6 最容易踩的坑，源头在这里。
  const stream = await navigator.mediaDevices.getUserMedia({
    audio: { channelCount: 1, echoCancellation: true,
             noiseSuppression: true, autoGainControl: true }
  });
  const ctx = new (window.AudioContext || window.webkitAudioContext)();
  const url = URL.createObjectURL(new Blob([WORKLET_SRC], { type: "application/javascript" }));
  try {
    await ctx.audioWorklet.addModule(url);
  } finally {
    URL.revokeObjectURL(url);
  }
  const src = ctx.createMediaStreamSource(stream);
  const node = new AudioWorkletNode(ctx, "pcm-collector");
  node.port.onmessage = (e) => onFrame(e.data);
  // 必须接到 destination 才会被音频图拉动；gain=0 保证不把麦克风声音放出来
  const gain = ctx.createGain();
  gain.gain.value = 0;
  src.connect(node);
  node.connect(gain);
  gain.connect(ctx.destination);

  Object.assign(A, { ctx, node, gain, src, stream,
                     seq: 0, frames: 0, samples: 0, dropped: 0,
                     batch: [], inflight: 0, queue: Promise.resolve(),
                     srvFrames: 0, srvSamples: 0, srvGaps: 0 });
  return { sampleRate: ctx.sampleRate };
}

// 停采集：先发完尾巴，再断开资源。返回这一轮的采集统计。
async function stopCapture() {
  if (A.node) A.node.port.onmessage = null;
  flushBatch();                    // 最后不足一批的帧也要发出去
  await A.queue;                   // 等所有分片落地，否则服务端样本数会少一截
  try {
    if (A.gain) A.gain.disconnect();
    if (A.node) A.node.disconnect();
    if (A.src) A.src.disconnect();
  } catch (e) { /* 已经断开过就忽略 */ }
  if (A.ctx) { try { await A.ctx.close(); } catch (e) { /* 同上 */ } }
  if (A.stream) A.stream.getTracks().forEach(t => t.stop());   // 及时松开麦克风

  const stat = { frames: A.frames, samples: A.samples, dropped: A.dropped };
  A.ctx = A.node = A.gain = A.src = A.stream = null;
  return stat;
}

// 收到一帧：攒进批次，够一批就发
function onFrame(d) {
  A.frames += 1;
  A.samples += d.pcm.byteLength / 2;
  A.batch.push(new Int16Array(d.pcm));
  if (A.batch.length >= BATCH_FRAMES) flushBatch();
  updateAudioLine();
}

// 把攒着的帧合成一片发出去。seq 用"这批第一帧的序号"，
// 服务端靠它判断有没有中间丢片（帧号不跳是 S1 的验收标准）。
function flushBatch() {
  if (!A.batch.length) return;
  const frames = A.batch;
  A.batch = [];
  let total = 0;
  for (const f of frames) total += f.length;
  const merged = new Int16Array(total);
  let off = 0;
  for (const f of frames) { merged.set(f, off); off += f.length; }

  const seq = A.seq;
  A.seq += frames.length;

  if (!S.sessionId) return;          // 还没开始通话，直接把音频丢掉
  if (A.inflight >= MAX_INFLIGHT) {
    // 背压：宁可丢片并记账，也不要把内存堆爆。
    // 丢片会让服务端看到 seq 缺口——这是故意的，掩盖丢片才是错的。
    A.dropped += frames.length;
    updateAudioLine();
    return;
  }
  A.inflight += 1;
  // 串行发送：保证到达顺序，也避免 seq 乱序被误判成丢片
  A.queue = A.queue.then(() => uploadChunk(seq, merged)).catch(() => {});
}

// 上传一片音频。失败不抛给用户，但要留痕（否则会以为"没声音"是麦克风坏了）
async function uploadChunk(seq, pcm16) {
  try {
    const q = "?session_id=" + encodeURIComponent(S.sessionId) +
              "&token=" + encodeURIComponent(S.token) +
              "&seq=" + seq + "&rate=16000";
    const r = await fetch("/api/audio/chunk" + q, {
      method: "POST",
      headers: { "Content-Type": "application/octet-stream" },
      body: pcm16.buffer
    });
    const d = await r.json();
    if (d.ok) {
      A.srvFrames = d.received_frames;
      A.srvSamples = d.received_samples;
      A.srvGaps = d.gaps;
    } else {
      log("系统", "音频分片被拒：" + (d.error || r.status) +
          (d.detail ? "（" + d.detail + "）" : ""));
    }
  } catch (e) {
    log("系统", "音频分片上传失败：" + e.message);
  } finally {
    A.inflight -= 1;
    updateAudioLine();
  }
}

// 采集状态条：这是 S1 唯一能"眼看为实"的地方
function updateAudioLine() {
  if (!S.recording && !A.frames) return;
  const parts = ["采集 " + A.frames + " 帧 / " + A.samples +
                 " 采样（" + (A.samples / 16000).toFixed(2) + " 秒）"];
  if (A.srvSamples) parts.push("服务端已收 " + A.srvSamples + " 采样");
  if (A.srvGaps) parts.push("序号缺口 " + A.srvGaps + " 次");
  if (A.dropped) parts.push("本地丢帧 " + A.dropped);
  $("audioLine").textContent = parts.join(" · ");
}

// 说话：点一次开始、再点一次结束（半双工；真的边识别边打断要等 S2/S3）
async function toggleRec() {
  if (S.busy) return;
  if (!S.recording) {
    try {
      const info = await startCapture();
      S.recording = true;
      $("btnRec").textContent = "停止并发送";
      $("audioLine").textContent = "采集中（设备 " + info.sampleRate +
                                   "Hz → 16kHz / 20ms 一帧，每 160ms 上传一次）";
    } catch (e) {
      log("系统", "拿不到麦克风：" + (e && e.message ? e.message : e) + "（可改用下面打字）");
    }
    return;
  }

  S.recording = false;
  $("btnRec").disabled = true;
  $("btnRec").textContent = "按下说话";
  // T0 = 用户说完的**那一刻**，必须在等分片上传落地之前取。
  // 如果放在 stopCapture() 之后，上传耗时就被悄悄排除了，
  // 首字响应会算得比用户真实感知的更快——那是自欺型数字。
  const t0 = performance.now();
  const stat = await stopCapture();
  if (!stat.samples) {
    log("系统", "这一轮没采到音频，已忽略。");
    $("btnRec").disabled = false;
    return;
  }
  log("系统", "采集结束：共 " + stat.frames + " 帧 / " + stat.samples + " 采样（" +
      (stat.samples / 16000).toFixed(2) + " 秒）" +
      (stat.dropped ? "，本地丢帧 " + stat.dropped : ""));
  try {
    await sendTurn({ audio_streamed: true, audio_dropped: stat.dropped }, t0);
  } finally {
    $("btnRec").disabled = false;
  }
}

// 一轮对话：把音频或文字发给后端，拿回回复并播报。
// t0 由调用方给：语音轮是"说完那一刻"（在等上传之前取），文字轮是"点发送那一刻"。
async function sendTurn(payload, t0) {
  if (!S.sessionId || S.busy) return;
  S.busy = true;
  $("btnSend").disabled = true;
  // T0：用户"说完 / 点发送"的时刻。首字响应从这里算到第一帧声音。
  S.t0 = t0 || performance.now();
  try {
    const r = await fetch("/api/turn", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(Object.assign({ session_id: S.sessionId, token: S.token }, payload))
    });
    const d = await r.json();
    if (d.error) { log("系统", "出错了：" + d.error + (d.detail ? "（" + d.detail + "）" : "")); return; }

    log("用户", d.user_text || "（无应答）");
    log("客服", d.reply_text, d.next_stage);
    if (d.tool_result) {
      log("系统", "工具调用：" + JSON.stringify(d.tool_result) + (d.closed ? "（已闭环并回写）" : ""));
    }
    if (d.compliance && d.compliance.blocked) {
      log("系统", "⚠ 合规护栏命中禁语：" + d.compliance.hits.join("、") + "，已整句替换");
    }

    S.turnId = d.turn_id;
    $("mTotal").textContent = d.latency.total_ms + " ms";
    speak(d.tts || { text: d.reply_text, mode: "browser" }, d.turn_id);
    refreshMetrics();
    refreshEvents();
  } catch (e) {
    log("系统", "请求失败：" + e.message);
  } finally {
    S.busy = false;
    if (S.sessionId) $("btnSend").disabled = false;
  }
}

// 播报：服务端合成好音频就播它，没合成成功才退回浏览器自带 TTS。
// 首字响应在这里测量：onplaying / onstart 触发时才是"用户真的听到声音"。
// 注意这个数现在**包含云 TTS 的合成耗时**——那才是真实的端到端首字。
function speak(tts, turnId) {
  const t0 = S.t0;
  const text = (tts && tts.text) || "";
  let reported = false;
  const report = (estimate) => {
    if (reported) return;
    reported = true;
    reportMetric(turnId, performance.now() - t0, estimate);
  };

  // 分段合成路线：第一段先出声，后面的段自动接上。
  // 服务端把长回复切成 3–5 字的头段 + 若干尾段并发合成，
  // 首字不用再等整句念完（30 字整句要 1.7 秒，切完头段约 0.35 秒）。
  if (tts && tts.mode === "segments" && Array.isArray(tts.segments) && tts.segments.length) {
    playSegments(tts, turnId, report, text);
    return;
  }

  // 服务端整句合成路线：<audio> 播 OSS 链接。不 fetch，所以不受 CORS 限制。
  if (tts && tts.mode === "url" && tts.audio_url) {
    const a = new Audio(tts.audio_url);
    a.onplaying = () => report(false);
    a.onerror = () => { log("系统", "音频播放失败，改用浏览器播报"); browserSpeak(text, report); };
    a.play().catch(() => { log("系统", "自动播放被拦截，改用浏览器播报"); browserSpeak(text, report); });
    return;
  }

  browserSpeak(text, report);
}

// 顺序播放分段音频。第一段出声就算"首字响应"。
// 服务端只等第一段就返回响应，剩下的段落在后台合成；这里播完首段再去取，
// 所以用户听到声音的时间不再取决于整句话有多长。
// 任何一段失败就整体回落浏览器播报——只播半句话比不播更难解释。
function playSegments(tts, turnId, report, fallbackText) {
  const queue = (tts.segments || []).slice();
  let restCount = tts.rest_count || 0;
  let reported = false;
  let aborted = false;

  const fallback = () => {
    if (aborted) return;
    aborted = true;
    log("系统", "分段音频播放失败，改用浏览器播报");
    browserSpeak(fallbackText, report);
  };

  const playNext = () => {
    if (aborted) return;

    if (!queue.length) {
      // 队列空了：还有剩余段就去取一次，取到接着播
      if (restCount > 0) {
        restCount = 0;
        fetchRestSegments(turnId).then((segs) => {
          if (aborted) return;
          if (segs.length) { queue.push(...segs); playNext(); }
        });
      }
      return;
    }

    const seg = queue.shift();
    const a = new Audio(seg.audio_url);
    a.onplaying = () => { if (!reported) { reported = true; report(false); } };
    a.onended = playNext;
    a.onerror = fallback;
    a.play().catch(fallback);
  };

  playNext();
}

// 取剩余段。失败就当作没有——少播一句也不能让播报卡死在那里。
async function fetchRestSegments(turnId) {
  if (!S.sessionId || !S.token) return [];
  try {
    const r = await fetch("/api/tts/rest?session_id=" + encodeURIComponent(S.sessionId) +
                          "&token=" + encodeURIComponent(S.token) +
                          "&turn_id=" + encodeURIComponent(turnId));
    if (!r.ok) return [];
    const d = await r.json();
    return Array.isArray(d.segments) ? d.segments : [];
  } catch (e) { return []; }
}

// 降级路线：浏览器 speechSynthesis。音色机械，但保证"有声音"。
function browserSpeak(text, report) {
  if (!("speechSynthesis" in window)) {
    report(true);
    return;
  }
  const u = new SpeechSynthesisUtterance(text);
  u.lang = "zh-CN";
  u.rate = 1.05;
  u.onstart = () => report(false);
  speechSynthesis.cancel();
  speechSynthesis.speak(u);
  // 兜底：个别浏览器不触发 onstart，1.5 秒后按"已开始播报"记一条估算值。
  // 宁可标 estimated，也不要让面板空着——空着会让人以为没在测。
  setTimeout(() => report(true), 1500);
}

// 把浏览器实测的首字响应回传给服务端，聚合口径才有一手数据
async function reportMetric(turnId, ms, estimate) {
  if (!turnId || !S.sessionId) return;
  const val = Math.round(ms);
  $("mFirst").textContent = val + (estimate ? " ms（估算）" : " ms");
  try {
    await fetch("/api/turn/metric", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        session_id: S.sessionId, token: S.token,
        turn_id: turnId, first_audio_ms: val, estimate: estimate
      })
    });
  } catch (e) { /* 上报失败不影响通话，聚合时按服务端下界计入 */ }
  refreshMetrics();
}

async function endCall() {
  if (!S.sessionId) return;
  // 挂断时如果还在采集，先停掉：否则麦克风会一直开着，音频还会往已结束的会话里发
  if (S.recording) {
    S.recording = false;
    $("btnRec").textContent = "按下说话";
    await stopCapture();
    $("audioLine").textContent = "麦克风已关闭。";
  }
  await fetch("/api/call/end", {
    method: "POST", headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ session_id: S.sessionId, token: S.token })
  });
  log("系统", "通话已结束。");
  $("btnStart").disabled = false;
  $("btnRec").disabled = true;
  $("btnEnd").disabled = true;
  $("textInput").disabled = true;
  $("btnSend").disabled = true;
  S.sessionId = null;
  S.token = null;
  refreshMetrics();
}

async function refreshMetrics() {
  try {
    const r = await fetch("/api/metrics");
    const d = await r.json();
    const p95 = d.first_audio_p95_ms ? d.first_audio_p95_ms + " ms" : "样本不足";
    $("mPct").textContent = d.first_audio_samples
      ? d.first_audio_p50_ms + " / " + p95
      : "— （暂无语音样本）";
    $("mClosed").textContent = d.closed_sessions + " 通（共 " + d.turns + " 轮）";

    const bits = [];
    bits.push("语音样本 " + d.first_audio_samples + (d.first_audio_estimated ? "（其中估算 " + d.first_audio_estimated + "）" : ""));
    bits.push("超时 " + d.first_audio_timeouts);
    if (d.first_audio_text_samples) bits.push("打字轮参考 P50 " + d.first_audio_text_p50_ms + "ms（不计入门槛）");
    bits.push("处理耗时 P50 " + d.processing_p50_ms + "ms");
    bits.push("估算成本 ¥" + d.est_cost_cny);
    $("metricNote").textContent = "门槛 " + d.gate_ms + "ms · " + bits.join(" · ");
  } catch (e) { /* 指标拉取失败不影响通话 */ }
}

async function refreshEvents() {
  if (!S.sessionId) return;
  try {
    const url = "/api/events?session_id=" + encodeURIComponent(S.sessionId) +
                "&token=" + encodeURIComponent(S.token);
    const r = await fetch(url);
    const d = await r.json();
    if (d.error) { $("events").textContent = "读取失败：" + d.error; return; }
    $("events").textContent = (d.events || []).map(e =>
      "#" + String(e.id).padStart(3, "0") + "  turn " + e.turn_id + "  " +
      e.type.padEnd(14) + " " + (e.latency_ms ? e.latency_ms + "ms" : "") +
      "\n     " + JSON.stringify(e.payload)
    ).join("\n") || "还没有事件。";
  } catch (e) { /* 忽略 */ }
}

$("btnStart").onclick = startCall;
$("btnRec").onclick = toggleRec;
$("btnEnd").onclick = endCall;
$("btnEvents").onclick = refreshEvents;
$("btnSend").onclick = () => {
  const t = $("textInput").value.trim();
  $("textInput").value = "";
  // 允许空发送：等于模拟"用户没说话"，用来验证沉默处理（记 no_answer、不推进状态机）。
  // 调试期很有用——真实电话里"没人应答"是常态，不能只在脚本里测。
  sendTurn({ text: t });
};
$("textInput").addEventListener("keydown", (e) => { if (e.key === "Enter") $("btnSend").click(); });

boot();
refreshMetrics();
</script>
</body>
